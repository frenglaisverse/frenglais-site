<script>
(function(){
const ecran=document.getElementById('ecran');
const score={}; // id -> true/false (première réponse)
const etat={step:0, sujet:'The receptionist', verbe:0, vitre:'none', fusion:false, valide:{}};
let tentative={}; // réponses du passage en cours sur l'écran affiché

// ---------- voix de synthèse ----------
let voixEn=null;
function chargerVoix(){ try{ const v=speechSynthesis.getVoices(); voixEn=v.find(x=>/en-US/i.test(x.lang)&&/Samantha|Google US|Aria|Jenny|Natural/i.test(x.name))||v.find(x=>/en-US/i.test(x.lang))||null; }catch(e){} }
if('speechSynthesis' in window){ chargerVoix(); speechSynthesis.onvoiceschanged=chargerVoix; }
const AUDIO={};
let lecteur=null;
function dire(t){
  if(AUDIO[t]){ try{ if(lecteur) lecteur.pause(); lecteur=new Audio(AUDIO[t]); lecteur.play(); return true; }catch(e){} }
  if(!('speechSynthesis' in window)) return false;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(voixEn) u.voice=voixEn; u.rate=.92; speechSynthesis.speak(u); return true;}catch(e){return false}
}
const icoSon='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function btnEcoute(t,label){return `<button type="button" class="ecoute" data-dire="${t.replace(/"/g,'&quot;')}">${icoSon}${label||'Écouter'}</button>`}

// ---------- Courbe SVG ----------
function courbe(opts){
  opts=opts||{};
  const codes=opts.codes!==false, ext=!!opts.ext;
  return `<div class="courbe"><svg viewBox="0 34 640 132" role="img" aria-label="La Courbe des Temps : T-2, T-1, T0, T+1">
    <path class="trace" pathLength="1" d="M14 92 C120 84 200 100 290 91 S450 84 540 92 S600 89 622 91" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path class="apparait" style="animation-delay:1.3s" d="M606 76 L624 91 L606 106" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="apparait" style="animation-delay:.6s" d="M250 80 L251 104" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path class="apparait" style="animation-delay:.9s" d="M410 79 L409 105" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text class="apparait" style="animation-delay:.6s" x="250" y="68" text-anchor="middle" fill="#fff" font-family="Geist Mono, monospace" font-size="15">T-1</text>
    <text class="apparait" style="animation-delay:.9s" x="410" y="68" text-anchor="middle" fill="#fff" font-family="Geist Mono, monospace" font-size="15">T0</text>
    ${codes?`<g class="apparait" style="animation-delay:1.4s"><rect x="218" y="116" width="64" height="40" rx="10" fill="#F0766F" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/><text x="250" y="143" text-anchor="middle" fill="#fff" font-family="Geist, sans-serif" font-size="20" font-weight="600">-ed</text>
    <rect x="380" y="116" width="60" height="40" rx="10" fill="#fff" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/><text x="410" y="143" text-anchor="middle" fill="#1C49A5" font-family="Geist, sans-serif" font-size="20" font-weight="600">-s</text></g>`:''}
    ${ext?`<g class="apparait" style="animation-delay:1.6s"><path d="M100 80 L101 104" stroke="#F0766F" stroke-width="4" stroke-linecap="round"/><path d="M540 80 L540 104" stroke="#F0766F" stroke-width="4" stroke-linecap="round"/>
    <text x="100" y="68" text-anchor="middle" fill="#F0766F" stroke="#8E2A23" stroke-width="3" paint-order="stroke" font-family="Geist Mono, monospace" font-size="15" font-weight="600">T-2</text><text x="540" y="68" text-anchor="middle" fill="#F0766F" stroke="#8E2A23" stroke-width="3" paint-order="stroke" font-family="Geist Mono, monospace" font-size="15" font-weight="600">T+1</text></g>`:''}
  </svg></div>`;
}

// ---------- Courbe complète (le modèle du rituel) ----------
// niv 1 = module 1 (repères + codes) · 2 = module 2 (crochets [ ], BV) · 3 = module 3 ([→ BE + -ING) · module 4 = aperçu (apercu=true) · 4 = module 5 (HAVE / HAD + -EN) · 5 = module 6 (T+1, Courbe complète)
// apercu = true : niveau 3 en couleur, niveaux 4-5 en filigrane (module 4)
function courbeComplete(niv,apercu){
  niv=apercu?5:(niv||5);
  const fi=apercu?' opacity=".3"':'';
  const J0='#FFD27A', R='#FFB3AE', B='#BFD3FF', V0='#FFB3AE', G='#9FE3C0', W='#fff', S='rgba(255,255,255,.72)';
  const J=apercu?W:J0, V=apercu?W:V0;
  const H=niv===1?240:niv===2?290:360, Y0=niv<4?52:0, yEx=niv===2?236:306;
  const t=(x,y,txt,c,sz,w,mono)=>`<text x="${x}" y="${y}" text-anchor="middle" fill="${c}" font-family="${mono?'Geist Mono, monospace':'Geist, sans-serif'}" font-size="${sz}" ${w?`font-weight="${w}"`:''}>${txt}</text>`;
  const lab2=(x,y,txt)=>`<text x="${x}" y="${y}" text-anchor="middle" fill="#F0766F" stroke="#8E2A23" stroke-width="3" paint-order="stroke" font-family="Geist Mono, monospace" font-size="14" font-weight="600">${txt}</text>`;
  const crochets=x=>`<path d="M${x-16} 184 h-6 v28 h6 M${x+16} 184 h6 v28 h-6" fill="none" stroke="${B}" stroke-width="2.5" stroke-linecap="round"/>`;
  const encours=x=>`<path d="M${x-28} 222 h-6 v24 h6" fill="none" stroke="${G}" stroke-width="2.5" stroke-linecap="round"/><path d="M${x-30} 234 H${x+26} M${x+18} 227 L${x+27} 234 L${x+18} 241" fill="none" stroke="${G}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<div class="courbe"><div class="defile"><svg viewBox="0 ${Y0} 760 ${H-Y0}" role="img" aria-label="La Courbe des Temps, niveau ${niv}">
    ${niv>=4?`<g${fi}>${t(200,24,'HAD + -EN',J,15,600)}${t(200,40,'pluperfect · passé dans le passé',S,11)}
    ${t(380,24,'HAVE + -EN',J,15,600)}${t(380,40,'present perfect · le pont',S,11)}</g>`:''}
    <rect x="258" y="142" width="64" height="34" rx="9" fill="#F0766F" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>${t(290,165,'-ed',W,18,600)}
    <rect x="440" y="142" width="60" height="34" rx="9" fill="#fff" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>${t(470,165,'-s','#1C49A5',18,600)}
    ${niv>=4?`<path d="M122 74 Q200 46 278 74 M302 74 Q380 46 458 74" fill="none" stroke="${J}" stroke-width="2.5" stroke-linecap="round"${apercu?' stroke-dasharray="2 7" opacity=".45"':''}/>`:''}
    <path class="trace" pathLength="1" d="M30 120 C150 114 230 126 330 119 S520 114 620 121 S700 119 722 120" fill="none" stroke="${W}" stroke-width="4" stroke-linecap="round"/>
    <path d="M706 106 L724 120 L706 134" fill="none" stroke="${W}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${[110,290,470,650].map(x=>`<path d="M${x} 108 L${x} 132" stroke="${x===110||x===650?'#F0766F':W}" stroke-width="4" stroke-linecap="round"/>`).join('')}
    ${lab2(110,98,'T-2')}${t(290,98,'T-1',W,14,0,1)}${t(470,98,'T0',W,14,0,1)}${lab2(650,98,'T+1')}
    <g transform="translate(0,40)">
    ${niv===1?`${t(110,180,'pas un temps',R,11)}${t(650,180,'pas un temps',R,11)}${t(290,182,'I left',W,13,500)}${t(470,182,'she leaves',W,13,500)}`:''}
    ${niv>=2?`${t(290,178,'BV',B,13,600)}${crochets(290)}${t(470,178,'BV',B,13,600)}${crochets(470)}`:''}
    ${niv>=2&&niv<4?t(110,180,'pas un temps',R,11):''}${niv>=2&&niv<5?t(650,180,'pas un temps',R,11):''}
    ${niv>=4?`<g${fi}>${t(110,180,'pas un temps :',S,11)}${t(110,195,'on y accède par HAD',S,11)}</g>`:''}
    ${niv>=3?`${encours(290)}${encours(470)}
    ${t(290,266,'WAS / WERE + -ING',G,12,600)}${t(470,266,'AM / IS / ARE + -ING',G,12,600)}
    ${t(290,282,'en train de',S,11)}${t(470,282,'en train de',S,11)}`:''}
    ${niv>=5?`<g${fi}>${t(650,180,'be going to + BV',V,13,600)}${t(650,195,'futur proche',S,11)}

function verifierVerrou(){
  const e=etapes[etat.step], suiv=document.getElementById('suiv'), v=document.getElementById('verrou');
  if(!e.gate||etat.step===etapes.length-1){ suiv.disabled=false; v.hidden=true; return; }
  let complet=false, ratio=0, nFaux=0;
  if(Array.isArray(e.gate)){ const faits=e.gate.filter(id=>id in tentative); complet=faits.length===e.gate.length; ratio=faits.filter(id=>tentative[id]).length/e.gate.length; nFaux=faits.filter(id=>!tentative[id]).length; }
  else if(e.gate==='courbe'){ complet='__courbe' in tentative; ratio=tentative.__courbe||0; nFaux=tentative.__courbeFaux||0; }
  else if(e.gate==='situ'){ complet=('__situA' in tentative)&&('__situB' in tentative); ratio=Math.min(tentative.__situA||0,tentative.__situB||0); nFaux=(tentative.__situAFaux||0)+(tentative.__situBFaux||0); }
  const ecrits=[...ecran.querySelectorAll('.q[data-bonnes]')];
  suiv.textContent=etat.step===etapes.length-1?'Terminer':'Suivant'; delete suiv.dataset.retry;
  if(!etat.valide[etat.step]&&ecrits.length){
    if(tentative.__retry){
      if(ecrits.every(q=>q.dataset.retryOk==='1')){ etat.valide[etat.step]=true; }
      else { suiv.disabled=true; v.hidden=false; v.className='verrou'; v.innerHTML='Réécrivez les '+ecrits.length+' réponses correctement pour continuer.'; return; }
    } else if(ecrits.every(q=>q.dataset.grise==='1')){
      suiv.disabled=false; suiv.textContent='Try again'; suiv.dataset.retry='1'; v.hidden=false; v.className='verrou ko';
      v.innerHTML='<strong>Les réponses vous ont été données.</strong> Réécrivez-les vous-même pour continuer.'; return;
    }
  }
  if(etat.valide[etat.step]){ suiv.disabled=false; v.hidden=false; v.className='verrou ok'; v.innerHTML='<strong class="en">Well done.</strong>'; return; }
  if(complet&&ratio>=.75){ etat.valide[etat.step]=true; suiv.disabled=false; v.hidden=false; v.className='verrou ok'; v.innerHTML='<strong class="en">Well done.</strong> Vous pouvez continuer.'; return; }
  suiv.disabled=true; v.hidden=false;
  if(complet){ v.className='verrou ko'; v.innerHTML='<strong>'+nFaux+' réponse'+(nFaux>1?'s':'')+' fausse'+(nFaux>1?'s':'')+'.</strong> Reprenez l\'écran : les questions reviennent à zéro.<button type="button" class="btn plein" id="refaire" lang="en">Try again</button>'; }
  else { v.className='verrou'; v.innerHTML='Répondez à toutes les questions pour passer à la suite.'; }
}
document.getElementById('verrou').addEventListener('click',e=>{ if(e.target.id==='refaire') aller(etat.step); });
function aller(i){
  etat.step=Math.max(0,Math.min(etapes.length-1,i));
  const e=etapes[etat.step];
  chrono.entrer(etat.step);
  tentative={}; etat.situNiv=1;
  if(etat.step===etapes.length-1&&!TOTAL){ sess.termine=true; chrono.cumuler(); scorm.terminer(1,1); }
  else if(etat.step===etapes.length-1){ const j=NOTEES.filter(k=>score[k]).length; sess.score={justes:j,total:TOTAL,pct:Math.round(j/TOTAL*100),module:MODULE,milieu:'Hôtellerie',date:new Date().toISOString()}; sess.termine=true; chrono.cumuler(); scorm.terminer(j,TOTAL); }
  ecran.innerHTML=e.html();
  document.body.classList.toggle('premier-ecran',etat.step===0);
  if(e.apres) e.apres();
  scorm.sauver(); sauver();
  document.getElementById('etape-nom').textContent=e.nom;
  try{ const av=+(localStorage.getItem('frg-intro-pct')||0), pc=Math.round(etat.step/(etapes.length-1)*100); if(localStorage.getItem('frg-intro')!=='fini'&&pc>av) localStorage.setItem('frg-intro-pct',pc); if(etat.step===etapes.length-1) localStorage.setItem('frg-intro','fini'); }catch(err){}
  const pct=Math.round(etat.step/(etapes.length-1)*100);
  document.getElementById('etape-num').textContent=pct+' %';
  document.getElementById('barre').style.width=Math.max(pct,2)+'%';
  document.getElementById('barre-box').setAttribute('aria-valuenow',pct);
  document.getElementById('prec').disabled=etat.step===0;
  document.getElementById('suiv').textContent=etat.step===etapes.length-1?'Terminer':'Suivant';
  try{ speechSynthesis.cancel(); }catch(err){}
  ecran.focus({preventScroll:true}); window.scrollTo({top:0});
  verifierVerrou();
}
document.getElementById('prec').onclick=()=>aller(etat.step-1);
document.getElementById('suiv').onclick=()=>{ const sv=document.getElementById('suiv');
  if(sv.dataset.retry==='1'){ tentative.__retry=true;
    ecran.querySelectorAll('.q[data-bonnes]').forEach(q=>{ const inp=q.querySelector('input'); inp.value=''; inp.disabled=false; inp.classList.remove('ok','ko','grise'); q.querySelector('[data-valider]').disabled=false; q.dataset.grise=''; q.dataset.retryOk=''; q.dataset.essais='0'; const r=q.querySelector('.retour'); r.className='retour'; r.innerHTML=''; });
    verifierVerrou(); const f=ecran.querySelector('.q[data-bonnes] input'); if(f) f.focus(); return; }
  if(etat.step===etapes.length-1){ sauver(); try{localStorage.setItem('frg-intro','fini');}catch(e){} location.href='espace-eleve.html'; } else aller(etat.step+1); };

ecran.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.sujet){etat.sujet=t.dataset.sujet; renduDemo();}
  else if(t.dataset.verbe){etat.verbe=+t.dataset.verbe; renduDemo();}
  else if(t.dataset.vitre){etat.vitre=etat.vitre===t.dataset.vitre?'none':t.dataset.vitre; renduDemo();}
  else if(t.id==='fusion'){etat.fusion=!etat.fusion; aller(etat.step);}
  else if(t.id==='verif-enigme'){
    const motsCles=[/base|infinitif|verbe nu|sans temps|pas conjugu|forme de base|to /i,/pass|pr[ée]t[ée]rit|-?ed|t-1|hier/i,/particip|-?en\b|pass[ée] compos|have|perfect|pp/i];
    const modele=['La base verbale : le verbe sans temps, pas encore placé sur la Courbe.','Le prétérit : le code -ed, T-1. Pour un irrégulier, le code est invisible.','Le participe passé : le code -EN, celui de have + -EN (module 5).'];
    let vide=0, html='';

    [1,2,3].forEach(i=>{const v=document.getElementById('col'+i).value.trim(); if(!v) vide++; const ok=motsCles[i-1].test(v);
      html+=`<div class="compare ${v?(ok?'juste':'faux'):''}"><strong>Colonne ${i}.</strong> Vous : « ${v?v.replace(/</g,'&lt;'):'…'} ». Réponse : ${modele[i-1]}</div>`;});

    pan.innerHTML=`<div class="f-in"><div class="eyebrow">Tableau formateur · ${MODULE_NOM}</div><h1>${docs.length} apprenant${docs.length>1?'s':''}</h1><p class="aide">Visible uniquement par vous. Chaque apprenant a sa propre session et voit son propre Tableau élève ; le temps compte seulement quand la page est ouverte au premier plan.</p><div><button type="button" class="btn" id="apercu-eleve">Aperçu du tableau élève</button></div>${recensement(docs,ps)}${cartes||'<p>Aucune session pour l\'instant.</p>'}</div>`;
  }
})();

<script type="module">/* Lamantin en 3D (three.js) : posé sur la case de la Courbe, il suit la souris
   et fait une bulle avec un drapeau (US, UK ou Australie) quand on touche un code. */
import * as THREE from './vendor/three.module.min.js';   // three.js r160, hébergé avec le site

const hote = document.getElementById('lamantin');

/* chaque visite tire un lamantin différent ; ?lamantin=nom pour en forcer un */
const TIRAGE = [['classique',12],['helice',3.5],['florida',3.5],['usa',3.5],['courbe',3.5],['tshirt',3.5],['uk',3.5],['australie',3.5],['canada',3.5],['france',3.5],['parasol',3.5],['golf',3.5],['vice',3.5],['bob',3.5],['paille',3.5],['bonnet',3.5],['lei',3.5],['tuba',3.5],['canard',3.5],['monaco',3.5],['casque',3.5],['rose',1]];   // rose : le très rare
function tirer(){
  try { const v = new URLSearchParams(location.search).get('lamantin'); if (v && TIRAGE.some(t => t[0] === v)) return v; } catch (e) {}
  let r = Math.random() * TIRAGE.reduce((s, t) => s + t[1], 0);
  for (const [nom, poids] of TIRAGE) { if ((r -= poids) < 0) return nom; } return 'classique';
}
const VARIANTE = (document.getElementById('lamantin') && document.getElementById('lamantin').dataset.variante) || tirer();
if (hote) try { lancer(); } catch (e) { hote.remove(); }

function lancer(){
  const L = 200, H = 140, H2 = 140;
  const rendu = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  rendu.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  rendu.setSize(L, H2);
  rendu.outputColorSpace = THREE.SRGBColorSpace;
  rendu.toneMapping = THREE.ACESFilmicToneMapping;
  rendu.toneMappingExposure = 1.05;
  hote.appendChild(rendu.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(26, L / H, 0.1, 50);
  camera.setViewOffset(L, H, 0, 0, L, H2);
  camera.position.set(-0.1, 1.15, 5.2);

  scene.add(new THREE.HemisphereLight(0xEEF3FF, 0x0E2766, .95));
  const cle = new THREE.DirectionalLight(0xFFF6EA, 2.8); cle.position.set(-2.5, 3.5, 3); scene.add(cle);
  const contre = new THREE.DirectionalLight(0xB9CCFF, 2.2); contre.position.set(2, 2.5, -3); scene.add(contre);

  /* peau : gris-brun mat, légèrement tachetée */
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = VARIANTE === 'rose' ? '#9C5A55' : '#545955'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    const v = 60 + Math.random() * 50 | 0, rose = VARIANTE === 'rose';
    g.fillStyle = rose ? `rgba(${v + 90},${v + 25},${v + 20},${Math.random() * .4})` : `rgba(${v},${v + 4},${v + 2},${Math.random() * .4})`;
    g.beginPath(); g.arc(Math.random() * 256, Math.random() * 256, Math.random() * 2.2, 0, 7); g.fill();
  }
  // voile d'algues vertes, par taches, comme sur les lamantins sauvages
  for (let i = 0; i < 16; i++) { const x = Math.random() * 256, y = Math.random() * 120, r = 10 + Math.random() * 24;
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, VARIANTE === 'rose' ? 'rgba(84,118,48,.5)' : 'rgba(88,124,52,.24)'); gr.addColorStop(1, 'rgba(88,124,52,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  // quelques cicatrices claires, très discrètes (les lamantins en portent presque tous)
  g.lineCap = 'round';
  for (let i = 0; i < 5; i++) { g.strokeStyle = 'rgba(190,192,184,.35)'; g.lineWidth = 1 + Math.random();
    const x = Math.random() * 256, y = Math.random() * 256; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 14, y + 6 - Math.random() * 12, x + 26 + Math.random() * 14, y + Math.random() * 8 - 4); g.stroke(); }
  // relief : grain fin + rides
  const rc = document.createElement('canvas'); rc.width = rc.height = 256; const rg = rc.getContext('2d');
  rg.fillStyle = '#808080'; rg.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5000; i++) { const v = Math.random() * 255 | 0; rg.fillStyle = `rgba(${v},${v},${v},.12)`; rg.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5); }
  for (let y = 0; y < 256; y += 9 + Math.random() * 6) { rg.strokeStyle = 'rgba(40,40,40,.18)'; rg.lineWidth = 1; rg.beginPath(); rg.moveTo(0, y); for (let x = 0; x <= 256; x += 16) rg.lineTo(x, y + Math.sin(x * .05 + y) * 2); rg.stroke(); }
  const relief = new THREE.CanvasTexture(rc); relief.wrapS = relief.wrapT = THREE.RepeatWrapping; relief.repeat.set(3, 2);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3, 2);
  const peau = new THREE.MeshStandardMaterial({ map:tex, bumpMap:relief, bumpScale:.6, roughness:.84, metalness:0 });
  const peauClaire = new THREE.MeshStandardMaterial({ color:VARIANTE === 'rose' ? 0xB06C66 : 0x676C67, roughness:.95 });
  const noir = new THREE.MeshStandardMaterial({ color:0x07080A, roughness:.15 });
  const ongle = new THREE.MeshStandardMaterial({ color:0xD9D3C4, roughness:.5 });

  const ajoute = (parent, objet) => { parent.add(objet); return objet; };   // add() renvoie le parent : on veut l'objet ajouté
  const boule = (r, mat, s = [1, 1, 1], p = [0, 0, 0], seg = 40) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * .75)), mat);
    m.scale.set(...s); m.position.set(...p); return m;
  };

  /* corps : un fuseau balayé le long d'une colonne, de la queue au cou */
  /* profil du corps : une courbe lisse (Catmull-Rom) échantillonnée finement, pour un fuseau sans méplats */
  function lisser(pts, n = 80){
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n; let k = 1; while (k < pts.length - 1 && t > pts[k][0]) k++;
      const p0 = pts[Math.max(0, k - 2)], p1 = pts[k - 1], p2 = pts[k], p3 = pts[Math.min(pts.length - 1, k + 1)];
      const u = (t - p1[0]) / (p2[0] - p1[0]), u2 = u * u, u3 = u2 * u;
      const r = .5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3);
      out.push([t, r]);

  }
  const PROFIL = lisser([[0, .09], [.13, .18], [.3, .36], [.5, .45], [.7, .44], [.87, .36], [1, .28]]);   // bien en chair
  // bosses irrégulières : quelques ondulations lentes, tirées au hasard à chaque visite
  const ph = Array.from({ length: 6 }, () => Math.random() * 6.3);
  const bosses = (t, a) => .04 * Math.sin(7 * t + ph[0]) * Math.sin(3 * a + ph[1]) + .028 * Math.sin(13 * t + ph[2]) * Math.cos(5 * a + ph[3]) + .014 * Math.sin(29 * t + ph[4] + 7 * a);
  function fuseau(points, rayons, radial = 48, n = 90){
    const courbe = new THREE.CatmullRomCurve3(points);
    const pos = [], idx = [], uv = [];
    const rayon = t => { for (let k = 1; k < rayons.length; k++) if (t <= rayons[k][0]) {
      const [t0, r0] = rayons[k - 1], [t1, r1] = rayons[k], u = (t - t0) / (t1 - t0);
      return r0 + (r1 - r0) * u; } return rayons.at(-1)[1]; };
    for (let i = 0; i <= n; i++) {
      const t = i / n, P = courbe.getPointAt(t), T = courbe.getTangentAt(t);
      const N = new THREE.Vector3(0, 0, 1), B = new THREE.Vector3().crossVectors(T, N).normalize();
      const r = rayon(t);
      for (let j = 0; j <= radial; j++) {
        const a = j / radial * Math.PI * 2;
        const rr = r * (1 + (rayons === PROFIL ? bosses(t, a) * Math.min(1, t * 6) : 0)) + (t > .78 && t < .97 ? Math.sin(t * 150) * .003 * Math.max(0, Math.sin(a)) : 0); // bosses + plis du cou
        const haut = Math.cos(a), aplati = haut < 0 ? .86 : 1;      // ventre un peu aplati, dos bien rond
        const v = P.clone().addScaledVector(B, haut * rr * aplati).addScaledVector(N, Math.sin(a) * rr * 1.13);
        pos.push(v.x, v.y, v.z); uv.push(j / radial, t);
      }
    }
    for (let i = 0; i < n; i++) for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx); geo.computeVertexNormals(); return geo;
  }

  const lamantin = new THREE.Group(); scene.add(lamantin);
  const corps = new THREE.Group(); lamantin.add(corps);
  const ORIENT = 0; corps.rotation.y = ORIENT;   // trois quarts : la tête et ses accessoires tournés vers le visiteur
  const colonne = [[1.16, .3], [.9, .33], [.56, .42], [.22, .47], [-.08, .52], [-.32, .6]].map(([x, y]) => new THREE.Vector3(x, y, 0));
  corps.add(new THREE.Mesh(fuseau(colonne, PROFIL, 56, 120), peau));
  // queue en pagaie, arrondie, posée à plat
  { const q = boule(.33, peau, [1.15, .11, 1], [1.4, .29, 0]); q.rotation.set(.75, 0, .08); corps.add(q); }
  // nageoires, avec leurs trois ongles
  const nageoires = {};
  for (const z of [-1, 1]) {
    const n = new THREE.Group(); nageoires[z] = n; n.position.set(-.1, .42, z * .43); n.rotation.set(z * -.45, z * .2, -.55);
    n.add(boule(.085, peau, [.7, 2.5, 1.4], [0, -.17, 0], 28));
    for (const k of [-1, 0, 1]) n.add(boule(.013, ongle, [1, .7, 1], [-.05, -.35, k * .04], 10));
    corps.add(n);
  }

  /* tête : pivote au niveau du cou */
  const cou = new THREE.Group(); cou.position.set(-.31, .6, 0); corps.add(cou);
  // jonction tête-corps : un volume de raccord pour une transition continue, sans creux de nuque ni de menton

  const tete = new THREE.Group(); cou.add(tete);
  // volumes de raccord rattachés à la tête : ils tournent avec elle, donc pas de « double tête »
  tete.add(boule(.25, peau, [1.15, .97, 1.08], [.11, .0, 0], 40));
  tete.add(boule(.19, peau, [1.15, .8, 1.08], [-.05, -.1, 0], 32));
  const face = new THREE.Vector3(-.75, -.12, .65).normalize();          // regarde vers l'avant-gauche
  const cote = new THREE.Vector3(.65, 0, .75).normalize();
  const centre = new THREE.Vector3(-.04, .08, 0);
  tete.add(boule(.25, peau, [1.05, .9, 1.04], centre.toArray()));
  // gros museau carré, lèvre supérieure fendue en deux lobes
  const museau = centre.clone().addScaledVector(face, .2).add(new THREE.Vector3(0, -.06, 0));
  for (const s of [-1, 1]) {
    const lobe = boule(.125, peauClaire, [.9, .88, 1], museau.clone().addScaledVector(cote, s * .06).addScaledVector(face, .02).toArray(), 32);
    tete.add(lobe);
    for (let i = 0; i < 16; i++) {           // soies
      const u = Math.random() * 1.2 - .6, w = Math.random() * .9 - .5;
      const d = face.clone().addScaledVector(cote, s * .35 + u * .5).add(new THREE.Vector3(0, w * .6, 0)).normalize();
      tete.add(boule(.0055, noir, [1, 1, 1], lobe.position.clone().addScaledVector(d, .1).toArray(), 6));
    }
  }
  tete.add(boule(.085, peau, [1, .7, 1], museau.clone().add(new THREE.Vector3(0, -.075, 0)).addScaledVector(face, -.01).toArray(), 28)); // menton
  for (const s of [-1, 1]) tete.add(boule(.018, noir, [1.4, .55, 1], museau.clone().addScaledVector(cote, s * .045).add(new THREE.Vector3(0, .085, 0)).addScaledVector(face, .04).toArray(), 12)); // narines
  // petits yeux enfoncés
  const yeux = [];
  for (const a of [1.12, -1.12]) {
    const d = face.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
    yeux.push(centre.clone().addScaledVector(d, .245).add(new THREE.Vector3(0, .06, 0)));
    const oeil = centre.clone().addScaledVector(d, .245).add(new THREE.Vector3(0, .06, 0));
    tete.add(boule(.05, new THREE.MeshStandardMaterial({ color:VARIANTE === 'rose' ? 0xC98880 : 0x868A85, roughness:.9 }), [1, 1, .45], centre.clone().addScaledVector(d, .236).add(new THREE.Vector3(0, .06, 0)).toArray(), 20)); // paupière claire
    tete.add(boule(.04, noir, [1, 1.1, .8], oeil.toArray(), 20));                       // œil noir bien visible
    const reflet = oeil.clone().addScaledVector(d, .029).add(new THREE.Vector3(-.01, .016, .007));

  }


  /* ---------- les variantes ---------- */
  function etiquette(l, h, dessin){
    const cv = document.createElement('canvas'); cv.width = l; cv.height = h; dessin(cv.getContext('2d'), l, h);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
  }
  const RAYONS = PROFIL;
  const rayonCorps = t => { for (let k = 1; k < RAYONS.length; k++) if (t <= RAYONS[k][0]) {
    const [t0, r0] = RAYONS[k - 1], [t1, r1] = RAYONS[k], u = (t - t0) / (t1 - t0); return r0 + (r1 - r0) * u; } return .235; };
  const dos = new THREE.CatmullRomCurve3(colonne);

  function casquette(fond, visiere, texte){
    const cap = new THREE.Group();
    const front = etiquette(512, 256, (x, l, h) => { x.fillStyle = fond; x.fillRect(0, 0, l, h); x.save(); x.translate(l * .14, 0); texte(x, l, h); x.restore(); });
    const calotte = new THREE.Mesh(new THREE.SphereGeometry(.2, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ map:front, roughness:.85 }));
    calotte.scale.set(1.02, .78, 1.02); cap.add(calotte);
    cap.add(boule(.018, new THREE.MeshStandardMaterial({ color:visiere, roughness:.8 }), [1, .6, 1], [0, .155, 0], 12)); // bouton
    const v = new THREE.Mesh(new THREE.CylinderGeometry(.17, .17, .014, 40, 1, false, -Math.PI / 2, Math.PI),
      new THREE.MeshStandardMaterial({ color:visiere, roughness:.8 }));
    v.scale.set(1, 1, .95); v.position.set(0, .004, .1); v.rotation.x = .12; cap.add(v);
    // la face avant de la calotte (u = 0,25 → +z) regarde dans la direction du museau
    const vers = face.clone().setY(0).normalize().add(new THREE.Vector3(.15, 0, 1)).normalize();   // logo tourné vers le visiteur
    cap.rotation.y = Math.atan2(vers.x, vers.z); cap.scale.setScalar(1.25);
    cap.position.copy(centre).add(new THREE.Vector3(0, .115, 0)).addScaledVector(face, -.02);
    cap.rotateX(-.12); tete.add(cap);
  }
  const ecrire = (x, txt, couleur, taille, cx, cy, police = '800') => {
    x.save(); x.translate(cx, cy); x.scale(.75, 1); x.fillStyle = couleur; x.font = `${police} ${taille}px Geist, Helvetica, Arial, sans-serif`;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, 0, 0); x.restore(); };

  function habiller(v){
    if (v === 'helice') {             // cicatrices d'hélice, cicatrisées, en biais sur le flanc visible
      const cic = new THREE.MeshStandardMaterial({ color:0xD8CFC4, roughness:.9 });
      for (const t0 of [.4, .47, .54]) {
        const pts = [];
        for (let k = 0; k <= 12; k++) {
          const a = .15 + k / 12 * 1.35, t = t0 + k / 12 * .05, P = dos.getPointAt(t), T = dos.getTangentAt(t);
          const B = new THREE.Vector3().crossVectors(T, new THREE.Vector3(0, 0, 1)).normalize(), r = rayonCorps(t) + .003;
          pts.push(P.clone().addScaledVector(B, Math.cos(a) * r).add(new THREE.Vector3(0, 0, Math.sin(a) * r * 1.1)));
        }
        corps.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .011, 6, false), cic));
      }
    }
    if (v === 'florida') casquette('#F4F1EA', '#E0662B', (x, l, h) => {
      ecrire(x, 'FLORIDA', '#0F7C8C', 58, l * .29, h * .62); x.fillStyle = '#E0662B'; x.fillRect(l * .1, h * .78, l * .3, 10); });

    if (v === 'courbe') casquette('#1C49A5', '#F0766F', (x, l, h) => {   // la Courbe des Temps brodée
      x.strokeStyle = '#fff'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath();
      x.moveTo(l * .25 - 90, h * .6); x.bezierCurveTo(l * .25 - 40, h * .55, l * .25 + 20, h * .66, l * .25 + 85, h * .6); x.stroke();
      x.beginPath(); x.moveTo(l * .25 + 72, h * .5); x.lineTo(l * .25 + 88, h * .6); x.lineTo(l * .25 + 72, h * .7); x.stroke();
      x.strokeStyle = '#F0766F'; x.beginPath(); x.moveTo(l * .25 - 22, h * .5); x.lineTo(l * .25 - 22, h * .7); x.stroke();
      x.strokeStyle = '#fff'; x.beginPath(); x.moveTo(l * .25 + 28, h * .52); x.lineTo(l * .25 + 28, h * .7); x.stroke(); });
    if (v === 'tshirt') {             // t-shirt orange et bleu, « GO MANATEES »
      const pts = [], n = 10; for (let i = 0; i <= n; i++) pts.push(dos.getPointAt(.6 + .3 * i / n));
      const tissu = etiquette(512, 256, (x, l, h) => {
        x.fillStyle = '#F07A28'; x.fillRect(0, 0, l, h); x.fillStyle = '#1B3F8F'; x.fillRect(0, 0, l, 16); x.fillRect(0, h - 16, l, 16);
        x.save(); x.translate(l * .25, h / 2); x.rotate(Math.PI / 2); x.scale(1, -1); ecrire(x, 'GO MANATEES', '#fff', 44, 0, 0); x.restore(); });
      const geo = fuseau(pts, [[0, rayonCorps(.6) * 1.1 + .01], [.5, rayonCorps(.75) * 1.1 + .01], [1, rayonCorps(.9) * 1.1 + .008]], 48, 30);
      corps.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map:tissu, roughness:.9, side:THREE.DoubleSide })));
    }
    /* ---------- accessoires communs ---------- */
    const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness:.7, ...o });
    const solLocal = new THREE.Box3().setFromObject(corps).min.y;          // le sol, dans le repère du corps
    const cou = t => { const P = dos.getPointAt(t), T = dos.getTangentAt(t), B = new THREE.Vector3().crossVectors(T, new THREE.Vector3(0, 0, 1)).normalize(); return { P, B, r:rayonCorps(t) }; };
    const surCorps = (t, a, dehors = 0) => { const { P, B, r } = cou(t); return P.clone().addScaledVector(B, Math.cos(a) * (r + dehors)).add(new THREE.Vector3(0, 0, Math.sin(a) * (r + dehors) * 1.1)); };
    const collier = (t, n, fabrique, dehors = .01) => { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, m = fabrique(i); m.position.copy(surCorps(t, a, dehors)); corps.add(m); } };
    function lunettes(verre, monture, rayon = .045){
      for (const p of yeux) {
        const sortie = p.clone().sub(centre).normalize(), pos = p.clone().addScaledVector(sortie, .042);
        const o = new THREE.Mesh(new THREE.TorusGeometry(rayon, .011, 8, 28), monture); o.position.copy(pos); o.lookAt(pos.clone().add(sortie)); tete.add(o);
        if (verre) { const g = new THREE.Mesh(new THREE.CircleGeometry(rayon, 28), verre); g.position.copy(pos).addScaledVector(sortie, .002); g.lookAt(g.position.clone().add(sortie)); tete.add(g); }
      }
      const pont = new THREE.Mesh(new THREE.TorusGeometry(.05, .005, 6, 16, Math.PI * .7), monture);
      pont.position.copy(centre).addScaledVector(face, .2).add(new THREE.Vector3(0, .07, 0)); pont.lookAt(pont.position.clone().add(face)); pont.rotateZ(Math.PI * .15); tete.add(pont);
    }
    function chapeauRond(couleur, hauteur, rayonHaut, rayonBas, bord, ruban){
      const ch = new THREE.Group();
