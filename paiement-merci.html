<script>/* mesure d'audience sans cookies (GoatCounter) : clics importants */
document.addEventListener('click',function(e){var g=window.goatcounter;if(!g||!g.count)return;var a=e.target.closest&&e.target.closest('a,button');if(!a)return;var h=a.getAttribute('href')||'',n='';
if(a.matches('.nav-devis'))n='menu-devis';else if(a.matches('.nav-eleve'))n='menu-espace-eleve';else if(a.matches('.btn-coffret')){var c=a.closest('[data-public]');n='coffret-devis-'+(c?c.getAttribute('data-public'):'');}
else if(a.matches('.solo-cta'))n='solo-acces';else if(h.indexOf('#devis')===0)n='devis-lien';else if(h.indexOf('trustpilot')>-1)n='trustpilot';else if(h.indexOf('amazon')>-1)n='livre-amazon';
else if(h.indexOf('fulbright')>-1)n='carte-fulbright';else if(h.indexOf('wlu.edu')>-1)n='carte-article';else if(h.indexOf('youtube')>-1)n='youtube';else if(h.indexOf('instagram')>-1)n='instagram';else if(h.indexOf('tiktok')>-1)n='tiktok';
else if(a.matches('.pol-carte'))n='carte-ouverte';if(n)g.count({path:'clic-'+n,title:n,event:true});},true);</script>
</head>

</nav></div></header>
<main class="in" style="max-width:720px;padding:40px 0 80px">
<style>
.mc{background:var(--carte);border:1px solid var(--trait);border-radius:22px;padding:28px}
.mc h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.02em;margin:10px 0 8px}.mc .sous{color:var(--doux);margin:0 0 18px}
.mc-ok{width:54px;height:54px;border-radius:50%;background:#1E7A4F;display:grid;place-items:center;color:#fff}
.mc table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0 18px}.mc td{padding:9px 0;border-bottom:1px solid var(--trait)}.mc td:first-child{color:var(--doux);width:38%}
.mc ol{padding-left:20px;line-height:1.6}.mc .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mc a.b{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;text-decoration:none;font-weight:600;background:linear-gradient(180deg,#2457C4,#1C49A5);color:#fff}
.mc a.b2{background:transparent;color:var(--encre);border:1px solid var(--trait)}
.mc .attente{color:var(--doux)}
</style>
<div class="mc" id="mc"><p class="attente">Confirmation de votre paiement…</p></div>
</main>
<script>
(function(){
var API='https://courbe-classement.paulodubmx84.workers.dev',s=new URLSearchParams(location.search).get('s'),mc=document.getElementById('mc'),essais=0;
var euro=function(c){return (c/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'};
var esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var dateDans=function(m){var d=new Date();d.setMonth(d.getMonth()+m);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})};
async function voir(){
  if(!s){mc.innerHTML='<h1>Commande introuvable</h1><p class="sous">Si vous avez été débité(e), écrivez-nous : <a href="mailto:contact@frenglais.co">contact@frenglais.co</a>.</p>';return;}
  var j;try{j=await (await fetch(API+'/paiement/confirmation?s='+encodeURIComponent(s),{cache:'no-store'})).json();}catch(e){j={erreur:'réseau'};}
  if(j.erreur){if(++essais<6)return setTimeout(voir,2500);mc.innerHTML='<h1>Nous vérifions votre paiement</h1><p class="sous">Vous recevrez vos accès par e-mail dans quelques minutes.</p><div class="spam-alerte" role="note" style="display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:12px 14px;border-radius:12px;background:#FFF4E5;border:1px solid #F0C27B;color:#4A3000;font-size:14.5px;line-height:1.5;text-align:left"><span aria-hidden="true" style="font-size:18px;line-height:1.3">⚠️</span><span><b>Pas d’e-mail d’ici 5 minutes ? Regardez dans vos courriers indésirables (spams).</b> Nos messages y arrivent parfois. Ouvrez-le, cliquez sur «&nbsp;Ce n’est pas un spam&nbsp;», et ajoutez contact@frenglais.co à vos contacts.</span></div><p class="sous"> Rien n’arrive ? <a href="mailto:contact@frenglais.co">contact@frenglais.co</a></p>';return;}
  if(j.statut!=='payé'&&++essais<6)return setTimeout(voir,2500);
  var reg=j.mode==='3x'?j.echeances.map(function(x,i){return euro(x)+(i?' le '+dateDans(i):' (réglé)')}).join(', '):euro(j.total)+' (réglé en une fois)';
  if(j.cadeau){if(!j.cadeau.lien&&++essais<8)return setTimeout(voir,2500);
   mc.innerHTML='<div class="mc-ok" aria-hidden="true">🎁</div><h1>Votre cadeau pour '+esc(j.cadeau.pour)+' est prêt.</h1><p class="sous">Paiement confirmé. Merci, et joyeuses fêtes.</p>'+
   '<table><tr><td>Vous offrez</td><td>'+esc(j.formule)+(j.edition==='fondateurs'?' · édition Fondateurs':'')+'</td></tr><tr><td>Réglé</td><td>'+euro(j.total)+'</td></tr><tr><td>Bon envoyé à</td><td>'+esc(j.email)+'</td></tr>'+(j.facture&&j.facture.numero?'<tr><td>Facture</td><td>n° '+esc(j.facture.numero)+'</td></tr>':'')+'</table>'+
   '<div class="spam-alerte" role="note" style="display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:12px 14px;border-radius:12px;background:#FFF4E5;border:1px solid #F0C27B;color:#4A3000;font-size:14.5px;line-height:1.5;text-align:left"><span aria-hidden="true" style="font-size:18px;line-height:1.3">⚠️</span><span><b>Pas d’e-mail d’ici 5 minutes ? Regardez dans vos courriers indésirables (spams).</b> Nos messages y arrivent parfois. Ouvrez-le, cliquez sur «&nbsp;Ce n’est pas un spam&nbsp;», et ajoutez contact@frenglais.co à vos contacts.</span></div><h2 style="font-size:18px;margin:0 0 6px">Et maintenant ?</h2><ol><li>Imprimez le bon, ou enregistrez-le en PDF. Il est aussi dans votre boîte mail.</li><li>'+esc(j.cadeau.pour)+' l’active sur frenglais.co/cadeau, quand elle ou il le souhaite, dans les 12 mois.</li><li>L’accès à vie démarre à l’activation.</li></ol>'+
   '<div class="btns">'+(j.cadeau.lien?'<a class="b" href="'+esc(j.cadeau.lien)+'">Voir et imprimer le bon</a>':'<span class="sous">Le bon arrive dans un instant par e-mail.</span>')+(j.facture&&j.facture.url?'<a class="b b2" href="'+esc(j.facture.url)+'" target="_blank" rel="noopener">Voir ma facture</a>':'')+'</div>';
   try{sessionStorage.removeItem('frg-tunnel');}catch(e){} return;}
  mc.innerHTML='<div class="mc-ok" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
   '<h1>Bienvenue dans '+esc(j.formule)+'.</h1><p class="sous">Votre paiement est confirmé. Merci pour votre confiance.</p>'+
   '<table><tr><td>Formule</td><td>'+esc(j.formule)+(j.edition==='fondateurs'?' · édition Fondateurs':'')+'</td></tr><tr><td>Règlement</td><td>'+reg+'</td></tr><tr><td>Facture au nom de</td><td>'+esc(j.nomFacture)+'</td></tr><tr><td>Accès envoyés à</td><td>'+esc(j.email)+'</td></tr>'+(j.facture&&j.facture.numero?'<tr><td>Facture</td><td>n° '+esc(j.facture.numero)+'</td></tr>':'')+'</table>'+
   '<h2 style="font-size:18px;margin:0 0 6px">Et maintenant ?</h2><ol><li>Vos identifiants arrivent par e-mail, dans la minute.</li><li>Connectez-vous à votre espace élève et commencez par l’introduction.</li><li>Rythme conseillé : deux modules par semaine, et la Minute Courbe chaque jour.</li></ol><div class="spam-alerte" role="note" style="display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:12px 14px;border-radius:12px;background:#FFF4E5;border:1px solid #F0C27B;color:#4A3000;font-size:14.5px;line-height:1.5;text-align:left"><span aria-hidden="true" style="font-size:18px;line-height:1.3">⚠️</span><span><b>Pas d’e-mail d’ici 5 minutes ? Regardez dans vos courriers indésirables (spams).</b> Nos messages y arrivent parfois. Ouvrez-le, cliquez sur «&nbsp;Ce n’est pas un spam&nbsp;», et ajoutez contact@frenglais.co à vos contacts.</span></div>'+
   '<div class="btns"><a class="b" href="espace-eleve.html">Ouvrir mon espace élève</a>'+(j.facture&&j.facture.url?'<a class="b b2" href="'+esc(j.facture.url)+'" target="_blank" rel="noopener">Voir ma facture</a>':'')+'</div>';
  try{sessionStorage.removeItem('frg-tunnel');}catch(e){}
}
voir();
})();
</script>
