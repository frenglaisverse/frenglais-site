<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leçons vidéo · Frenglais</title>
<meta name="robots" content="noindex">
<meta name="description" content="L'espace en ligne des élèves Frenglais : modules, progression et suivi.">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=202611271845">
<style>
.lv{max-width:880px;margin:0 auto;padding:40px 20px 80px}
.lv-sur{font:500 12px var(--f-mono,ui-monospace,monospace);letter-spacing:.14em;text-transform:uppercase;color:#1C49A5;margin:0 0 6px}
.lv h1{margin:0 0 6px;font-size:clamp(30px,5vw,44px);letter-spacing:-.02em}
.lv-chapo{color:var(--doux,#4A5578);margin:0 0 24px;max-width:560px}
.ardoise{position:relative;background:#2F4A3A;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:5px 5px;border:10px solid #8B5E34;border-radius:6px;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 20px 40px -26px rgba(0,0,0,.6);padding:22px 20px;color:#F4EEDC}
.ardoise::after{content:"";position:absolute;left:18%;right:18%;bottom:-18px;height:8px;background:#6E4826;border-radius:0 0 4px 4px}
.lv-liste{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lv-l{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;font-family:"Comic Sans MS","Chalkboard SE","Segoe Print",cursive}
.lv-l b{font:600 13px var(--f-mono,ui-monospace,monospace);opacity:.75;min-width:30px}
.lv-l span{flex:1;font-size:18px}
.lv-l em{font:500 12px var(--f-mono,ui-monospace,monospace);font-style:normal;opacity:.7}
button.lv-l{width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
button.lv-l:hover{background:rgba(255,255,255,.08)}
button.lv-l em{opacity:1;color:#FFD25A}
.lv-l.bientot{opacity:.55}
.lv-video{margin:0 0 18px;border-radius:10px;overflow:hidden;background:#000}
.lv-video video{display:block;width:100%;height:auto}
.lv-retour{display:inline-block;margin-top:34px;color:#1C49A5;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<header class="bandeau"><div class="in in-mousse"><canvas class="mousse" id="mousse" data-relatif="1" data-pash="0.075" data-modele='[[0.027,8],[0.113,10],[0.233,3],[0.367,2],[0.5,3],[0.15,4],[0.165,6],[0.18,3],[0.29,5],[0.305,7],[0.32,4],[0.42,4],[0.435,6],[0.45,3],[0.56,3],[0.575,5],[0.59,3]]' aria-hidden="true"></canvas><nav class="nav" aria-label="Navigation principale">
  <a href="index.html" aria-label="Frenglais, accueil"><img src="logo-nav.webp" alt="Frenglais" width="158" height="56"></a>
  <div class="nav-liens"><a class="lien-sec" href="index.html#formations">Formations</a><a class="lien-sec" href="index.html#methode">La méthode</a><span class="sep" aria-hidden="true"></span><a class="nav-eleve" href="espace-eleve.html"><span>Espace élève</span></a><a class="nav-devis" href="index.html#devis"><span>Demander un devis</span></a></div>
</nav></div></header>
<main class="lv">
  <p class="lv-sur">Votre espace</p>
  <h1>Leçons vidéo</h1>
  <p class="lv-chapo">Une courte leçon au tableau pour chaque module. Elles arrivent au fil des modules.</p>
  <div class="lv-video" id="lecteur" hidden></div>
  <div class="ardoise"><ol class="lv-liste" id="liste"></ol></div>
  <a class="lv-retour" href="espace-eleve.html">← Retour à l'espace élève</a>
</main>
<script>
(function(){
  const TITRES=['Repères et codes',"T0, le temps le plus simple","T-1, toujours simple","BE + -ING","HAVE + -EN","T-2, le passé dans le passé","T+1, l'éléphant dans la pièce","Les modaux","HAVE BEEN + -ING","Poser des questions","Spit it : dites-le","Toute la Courbe","Les quatre couteaux suisses","Les verbes à particule","Le verbe choisit sa préposition","Ne plus bloquer","Se présenter pour de vrai","Écrire un e-mail","Téléphone et visio","Chiffres, dates, heures, prix","Comparer et décrire","Relier ses idées","Si…","L'anglais réel","Le passif","Les habitudes passées","Les regrets","Rapporter des paroles","Convaincre","Prendre la parole","Continuer seul","Le grand oral"];
  const L=[['00','Présentation · trois minutes avec Paul','video/presentation-720.mp4','video/presentation.jpg']].concat(TITRES.map((t,i)=>[String(i+1).padStart(2,'0'),t,'','']));
  const ul=document.getElementById('liste'), lec=document.getElementById('lecteur');
  ul.innerHTML=L.map(([n,t,src,poster],i)=>src?`<li><button class="lv-l" type="button" data-i="${i}"><b>${n}</b><span>${t}</span><em>▶ 3 min</em></button></li>`:`<li class="lv-l bientot"><b>${n}</b><span>${t}</span><em>Bientôt</em></li>`).join('');
  ul.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ const [,,src,poster]=L[+b.dataset.i]; lec.hidden=false; lec.innerHTML=`<video controls playsinline autoplay poster="${poster}"><source src="${src}" type="video/mp4"></video>`; lec.scrollIntoView({behavior:'smooth',block:'start'}); }));
})();
</script>
</body>
</html>
