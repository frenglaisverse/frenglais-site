<body>
<style>
/* Layout : une console 8 bits. HUD en haut, l'écran (Courbe pixelisée + lamantin qui nage), la bulle de dialogue avec la phrase, puis la zone de jeu. */
:root{
  --nuit:#0E1B3D; --ecran:#0A1330; --ecran2:#101C44; --creme:#F4EEDC; --doux:#9AA8CC;
  --bleu:#1C49A5; --bleu-clair:#4D7BE0; --corail:#F0766F; --jaune:#FFD25A; --vert:#5FD39A;
  --or:#FFD25A; --argent:#C9D3E6; --bronze:#D9935B; --cadre:#2A3F73;
  --pix:"Press Start 2P",ui-monospace,monospace; --vt:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nuit:#0E1B3D;--ecran:#0A1330;--creme:#F4EEDC}}
:root[data-theme="dark"]{--nuit:#0E1B3D;--ecran:#0A1330;--creme:#F4EEDC}
html:has(body.vice){background:#1E0733}
*{box-sizing:border-box}
html{background:var(--nuit)}
body{margin:0;background:var(--nuit);background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;color:var(--creme);font:22px/1.15 var(--vt);
  padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));-webkit-font-smoothing:none}
a{color:var(--jaune)}
button{font:inherit;color:inherit}
.console{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.px{box-shadow:0 -4px 0 0 var(--b,var(--cadre)),0 4px 0 0 var(--b,var(--cadre)),-4px 0 0 0 var(--b,var(--cadre)),4px 0 0 0 var(--b,var(--cadre))}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.retour{font:10px var(--pix);color:var(--doux);text-decoration:none;display:inline-block;margin-bottom:10px}
.retour:hover{color:var(--creme)}
.titre{font:16px/1.35 var(--pix);margin:0;letter-spacing:.02em;text-shadow:3px 3px 0 var(--bleu)}
.titre span{color:var(--corail)}
.num{font:10px var(--pix);color:var(--doux);margin-top:8px}
.compteurs{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font:10px var(--pix);color:var(--doux)}
.compteurs b{color:var(--jaune);font-weight:400}
.son{background:none;border:0;padding:4px 0;cursor:pointer;font:10px var(--pix);color:var(--doux)}
.son:hover{color:var(--creme)}

/* Écran */
.ecran{position:relative;background:var(--ecran);padding:16px 14px 18px;margin:4px;display:flex;flex-direction:column;gap:16px;--b:var(--bleu)}
.ecran::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.scene{position:relative}
.scene canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.labels span{position:absolute;top:0;transform:translateX(-50%);font:9px var(--pix);color:var(--doux);transition:color .2s}
.labels span.vu{color:var(--jaune)}
.pastille{position:absolute;bottom:2px;transform:translateX(-50%) scale(.6);opacity:0;font:9px/1 var(--pix);color:var(--nuit);padding:6px 7px 5px;white-space:nowrap;transition:transform .25s steps(3),opacity .1s}
.pastille.vu{transform:translateX(-50%) scale(1);opacity:1}
.cases{display:flex;gap:12px;justify-content:center}
.cases i{width:30px;height:30px;background:var(--ecran2);--b:var(--cadre);display:block}
.cases i.en-cours{--b:var(--creme);animation:clig 1s steps(2) infinite}
.cases i.juste{background:var(--bleu-clair);--b:var(--bleu-clair)}
.cases i.rate{background:var(--corail);--b:var(--corail)}
@keyframes clig{50%{--b:var(--cadre)}}

/* Bulle de dialogue */
.bulle{background:var(--creme);color:var(--nuit);padding:12px 14px 14px;margin:4px;--b:var(--creme);position:relative}
.bulle small{display:block;font:8px var(--pix);color:var(--bleu);margin-bottom:8px;letter-spacing:.04em}
.bulle p{margin:0;font:28px/1.05 var(--vt);min-height:2.1em}
.bulle .curseur{display:inline-block;width:.45em;height:.8em;background:var(--nuit);vertical-align:-.05em;animation:clig2 .8s steps(2) infinite}
@keyframes clig2{50%{opacity:0}}

/* La carte : dos bleu, face avant = la phrase. Au lancement, elle se retourne et tout le reste se floute. */
.carte{perspective:1000px;position:relative;z-index:2;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.carte-in{display:grid;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.35,1.25,.5,1)}
.carte.retournee .carte-in{transform:rotateY(180deg)}
.carte.sans-anim .carte-in{transition:none}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.carte .bulle{transform:rotateY(180deg)}
.dos{margin:4px;--b:var(--creme);background-color:var(--bleu);background-image:linear-gradient(45deg,rgba(255,255,255,.08) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.08) 75%),linear-gradient(45deg,rgba(255,255,255,.08) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.08) 75%);background-size:16px 16px;background-position:0 0,8px 8px;display:flex;align-items:center;justify-content:center;gap:18px;min-height:118px}
.dos canvas{width:80px;image-rendering:pixelated}
.dos span{font:30px var(--pix);color:var(--jaune);text-shadow:3px 3px 0 var(--nuit)}
.flou{transition:filter .4s,opacity .4s}
body.lancement .flou{filter:blur(6px);opacity:.35;pointer-events:none}
body.lancement .carte{transform:scale(1.06)}

/* Zone de jeu */
.q-tete{display:flex;justify-content:space-between;align-items:center;gap:8px;font:10px var(--pix);margin-bottom:10px}
.q-tete span{color:var(--doux)}
.chrono{display:flex;gap:2px;margin-bottom:14px}
.chrono i{flex:1;height:8px;background:var(--jaune)}
.chrono i.vide{background:var(--ecran2)}
.chrono.urgent i:not(.vide){background:var(--corail)}
.choix{display:grid;gap:12px;padding:4px}
.choix.deux{grid-template-columns:1fr 1fr}
.choix button{position:relative;text-align:left;background:var(--bleu);--b:var(--nuit);border:0;padding:10px 12px 10px 30px;font:24px/1 var(--vt);cursor:pointer;min-height:48px;box-shadow:0 -4px 0 0 var(--b),0 4px 0 0 var(--b),-4px 0 0 0 var(--b),4px 0 0 0 var(--b),inset 0 -4px 0 rgba(0,0,0,.25)}
.choix.mono button{font:12px/1.5 var(--pix);padding-top:14px;padding-bottom:12px}
.choix button::before{content:attr(data-k);position:absolute;left:10px;top:50%;transform:translateY(-50%);font:8px var(--pix);color:var(--doux)}
.choix button:hover:not(:disabled),.choix button:focus-visible{background:var(--bleu-clair);outline:none}
.choix button:hover:not(:disabled)::before,.choix button:focus-visible::before{content:"▶";color:var(--jaune)}
.choix button:active:not(:disabled){transform:translateY(3px)}
.choix button:disabled{cursor:default}
.choix button.ok{background:var(--vert);color:var(--nuit)}
.choix button.ok::before{content:"✔";color:var(--nuit)}
.choix button.ko{background:var(--corail);color:var(--nuit);animation:secoue .3s steps(4)}
.choix button.ko::before{content:"✖";color:var(--nuit)}
.choix button.eteint{opacity:.35}
@keyframes secoue{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{font:12px var(--pix);text-align:center;min-height:1.6em;margin-top:14px;line-height:1.6}
.flash.ok{color:var(--vert)}.flash.ko{color:var(--corail)}
.flash b{color:var(--jaune);font-weight:400}

/* Écran titre */
.titre-ecran{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:6px 0}
.titre-ecran canvas{width:150px;image-rendering:pixelated;animation:flotte 1.6s steps(4) infinite}
@keyframes flotte{50%{transform:translateY(-6px)}}
.regle{font:9px/2 var(--pix);color:var(--doux);margin:0}
.regle b{color:var(--creme);font-weight:400}
.start{background:var(--corail);--b:var(--nuit);color:var(--nuit);border:0;font:13px var(--pix);padding:16px 22px 14px;cursor:pointer;margin:6px}
.start:hover,.start:focus-visible{background:var(--jaune);outline:none}
.start .cl{animation:clig2 1s steps(2) infinite}

/* Bonus */
@keyframes eclair{0%,100%{background:var(--ecran)}20%,60%{background:#2B4FA8}40%{background:var(--ecran)}}
.ecran.eclair{animation:eclair .6s steps(5)}
.bonus{display:flex;flex-direction:column;gap:16px}
.bonus-titre{text-align:center;display:flex;flex-direction:column;gap:8px}
.bonus-titre span{font:9px var(--pix);color:var(--corail);animation:clig2 .9s steps(2) 4}
.bonus-titre b{font:15px/1.4 var(--pix);color:var(--jaune);text-shadow:3px 3px 0 var(--bleu);font-weight:400}
.bonus-titre small{font:8px var(--pix);color:var(--doux)}
.indices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.indices li{background:var(--ecran2);padding:10px 12px;margin:4px;--b:var(--cadre);font-size:22px;line-height:1.15;animation:apparait .35s steps(4)}
.indices li span{display:block;font:8px var(--pix);color:var(--jaune);margin-bottom:6px}
.indices li.ferme{color:var(--cadre);animation:none}
.indices li.ferme span{color:var(--cadre)}
@keyframes apparait{from{opacity:0;transform:translateY(6px)}}
.bonus-actions{display:flex;justify-content:space-between;gap:10px}
.lien{background:none;border:0;padding:6px 0;font:9px var(--pix);color:var(--doux);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.lien:hover,.lien:focus-visible{color:var(--creme);outline:none}
.secoue{animation:secoue .3s steps(4)}
.ico-q{width:64px;height:64px;display:grid;place-items:center;font:28px var(--pix);color:var(--nuit);background:var(--jaune);box-shadow:0 -4px 0 0 var(--nuit),0 4px 0 0 var(--nuit),-4px 0 0 0 var(--nuit),4px 0 0 0 var(--nuit),inset -4px -4px 0 rgba(0,0,0,.2)}
.lot{font:8px/1.9 var(--pix);color:var(--doux);margin:0 0 12px!important}
.lot b{color:var(--jaune);font-weight:400}
.signature{text-align:center;font-size:19px;color:var(--doux);margin:0}
.signature a{color:var(--doux)}

.gagne{--b:var(--jaune)}
.gagne h3{color:var(--jaune)}
.gagne p{margin:0 0 8px}
.gagne b{color:var(--jaune);font-weight:400}

/* Vice City : un jour par saison, tout passe en rose et les points doublent */
.vice-badge{display:none;font:8px/1.8 var(--pix);color:#FFE45C;margin-top:10px;text-shadow:2px 2px 0 #FF2E93}
body.vice .vice-badge{display:block}
body.vice{min-height:100vh;position:relative;z-index:0;--nuit:#2A0B3F;--ecran:#1B0730;--ecran2:#33124F;--bleu:#FF2E93;--bleu-clair:#FF6EC7;--corail:#00E0FF;--jaune:#FFE45C;--cadre:#7B2FBE;--doux:#E3B5F0;
  background:linear-gradient(180deg,#1E0733 0%,#4A1162 40%,#C8336E 72%,#FF9E5E 100%) fixed}
body.vice::before{content:"";position:fixed;left:-20%;right:-20%;bottom:0;height:38vh;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,224,255,.45) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,rgba(0,224,255,.45) 0 2px,transparent 2px 34px);
  transform:perspective(260px) rotateX(58deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
body.vice::after{content:"";position:fixed;left:50%;bottom:34vh;width:220px;height:110px;margin-left:-110px;z-index:-1;pointer-events:none;border-radius:110px 110px 0 0;
  background:repeating-linear-gradient(180deg,#FFE45C 0 14px,#FF6E8A 14px 18px)}
body.vice .titre{text-shadow:3px 3px 0 #00E0FF}
body.vice .titre span{color:#FF6EC7}
body.vice .ecran{--b:#FF2E93}
body.vice .bulle{--b:#FFE45C}
/* Noël : le 25 décembre, décor vert et rouge sous la neige */
html:has(body.noel){background:#06231A}
body.noel .vice-badge{display:block;color:#FFF;text-shadow:2px 2px 0 #D62839}
body.noel{min-height:100vh;position:relative;z-index:0;--nuit:#0B3B2A;--ecran:#062418;--ecran2:#0F4A33;--bleu:#D62839;--bleu-clair:#FF6B6B;--corail:#FFD166;--jaune:#FFD166;--cadre:#1F7A4D;--doux:#CFE8D8;
  background:linear-gradient(180deg,#06231A 0%,#0B3B2A 60%,#145C3F 100%) fixed}
body.noel::before{content:"";position:fixed;inset:-200px 0 0 0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(#FFF 0 2px,transparent 2.5px),radial-gradient(#FFF 0 3px,transparent 3.5px),radial-gradient(rgba(255,255,255,.7) 0 2px,transparent 2.5px);
  background-size:90px 100px,150px 200px,60px 200px;background-position:10px 0,60px 50px,30px 120px;animation:neige 9s linear infinite}
@keyframes neige{to{transform:translateY(200px)}}
@media (prefers-reduced-motion:reduce){body.noel::before{animation:none}}
body.noel .titre{text-shadow:3px 3px 0 #D62839}
body.noel .titre span{color:#FFD166}
body.noel .ecran{--b:#D62839}
body.noel .bulle{--b:#FFD166}
body.vice .choix button:hover:not(:disabled),body.vice .choix button:focus-visible,body.noel .choix button:hover:not(:disabled),body.noel .choix button:focus-visible,body.vice .tuiles button:hover:not(:disabled),body.noel .tuiles button:hover:not(:disabled){color:var(--nuit)}
.vc{font:9px var(--pix);color:#FFE45C;margin:0 0 10px;text-shadow:2px 2px 0 #FF2E93}

/* Question 4 */
.question4 p{font-size:23px;line-height:1.15}
.cases-mot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.cases-mot i{width:30px;height:38px;border-bottom:4px solid var(--creme);display:flex;align-items:center;justify-content:center;font:16px var(--pix);font-style:normal;color:var(--creme)}
.cases-mot i.fixe{color:var(--jaune);border-color:var(--jaune)}
.cases-mot.secoue{animation:secoue .3s steps(4)}
.tuiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:4px}
.tuiles button{width:44px;height:48px;background:var(--bleu);border:0;font:16px var(--pix);color:var(--creme);cursor:pointer;box-shadow:0 -4px 0 0 var(--nuit),0 4px 0 0 var(--nuit),-4px 0 0 0 var(--nuit),4px 0 0 0 var(--nuit),inset 0 -4px 0 rgba(0,0,0,.25)}
.tuiles button:hover:not(:disabled){background:var(--bleu-clair)}
.tuiles button:active:not(:disabled){transform:translateY(3px)}
.tuiles button:disabled{opacity:.25;cursor:default}
@media (max-width:380px){.cases-mot i{width:24px;font-size:13px}.tuiles button{width:38px}}

.nom-avant{flex-direction:column;align-items:stretch;gap:8px;width:100%;max-width:300px}
.nom-avant label{font:8px var(--pix);color:var(--jaune)}
.nom-avant input{text-align:center}
.titre-ecran .note{margin:0;min-height:1.1em}

/* Fin */
.fin{display:flex;flex-direction:column;gap:18px}
.verdict{text-align:center}
.verdict h2{font:18px/1.4 var(--pix);margin:0 0 8px;color:var(--jaune);text-shadow:3px 3px 0 var(--corail)}
.verdict .score{font:11px var(--pix);color:var(--doux)}
.verdict .score b{display:block;font:30px/1.3 var(--pix);color:var(--creme);font-weight:400;margin-top:6px}
.boite{background:var(--ecran2);padding:12px 14px;margin:4px;--b:var(--cadre)}
.boite h3{font:9px var(--pix);color:var(--jaune);margin:0 0 10px;letter-spacing:.04em}
.boite p{margin:0}
.explication{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.ico-lam{width:64px;image-rendering:pixelated;margin-top:6px;animation:flotte 1.6s steps(4) infinite}
.explication .reperes{font:9px/1.8 var(--pix);color:var(--jaune);margin-bottom:8px}
.explication .juste{font-size:24px;color:var(--vert);margin-bottom:6px}
.explication code{font:inherit;color:var(--jaune);white-space:nowrap}
.explication b{color:var(--creme);font-weight:400;text-decoration:underline;text-decoration-color:var(--corail);text-underline-offset:3px}
.source{font-size:19px;color:var(--doux);margin-top:10px!important}
.partage pre{margin:0 0 12px;font:22px/1.1 var(--vt);white-space:pre-wrap;user-select:all}
.btn{display:inline-block;background:var(--creme);--b:var(--nuit);color:var(--nuit);border:0;font:10px var(--pix);padding:12px 14px 10px;cursor:pointer;text-decoration:none;margin:4px;box-shadow:0 -4px 0 0 var(--nuit),0 4px 0 0 var(--nuit),-4px 0 0 0 var(--nuit),4px 0 0 0 var(--nuit),inset 0 -4px 0 rgba(0,0,0,.2)}
.btn:hover,.btn:focus-visible{background:var(--jaune);outline:none}
.btn.bleu{background:var(--bleu);color:var(--creme)}
.btn.bleu:hover{background:var(--bleu-clair)}
.note{font-size:19px;color:var(--doux);margin:8px 0 0}
.note.err{color:var(--corail)}
.pseudo{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pseudo input{flex:1;min-width:150px;background:var(--nuit);color:var(--creme);border:0;font:22px var(--vt);padding:8px 10px;margin:4px;--b:var(--cadre);box-shadow:0 -4px 0 0 var(--cadre),0 4px 0 0 var(--cadre),-4px 0 0 0 var(--cadre),4px 0 0 0 var(--cadre);text-transform:uppercase}
.pseudo input:focus{outline:none;box-shadow:0 -4px 0 0 var(--jaune),0 4px 0 0 var(--jaune),-4px 0 0 0 var(--jaune),4px 0 0 0 var(--jaune)}
.onglets{display:flex;gap:6px;margin-bottom:12px}
.onglets button{background:none;border:0;font:8px var(--pix);color:var(--doux);padding:6px 4px;cursor:pointer}
.onglets button[aria-selected="true"]{color:var(--jaune);text-decoration:underline;text-underline-offset:5px}
.top{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.top li{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;font-size:24px}
.top li .rg{font:9px var(--pix)}
.top li:nth-child(1) .rg{color:var(--or)}.top li:nth-child(2) .rg{color:var(--argent)}.top li:nth-child(3) .rg{color:var(--bronze)}
.top li .pt{font:11px var(--pix);color:var(--creme)}
.top li.moi{color:var(--jaune)}
.top li.vide{color:var(--doux)}
.rang{font-size:19px;color:var(--doux);margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.stats div{font-size:18px;color:var(--doux)}
.stats b{display:block;font:14px/1.6 var(--pix);color:var(--creme);font-weight:400}
.prochaine{text-align:center;font:9px/1.8 var(--pix);color:var(--doux);margin:0}
.prochaine b{color:var(--creme);font-weight:400;font-size:12px}
.pub{background:var(--corail);color:var(--nuit);padding:14px;margin:4px;--b:var(--corail)}
.pub p{margin:0 0 10px;font-size:24px}
.pub p:first-child{font:10px/1.7 var(--pix)}
.pub .btn{background:var(--nuit);color:var(--creme);--b:var(--nuit)}
.pub .btn:hover{background:var(--bleu)}
.apercu{display:flex;justify-content:center;align-items:center;gap:10px;font:8px var(--pix);color:var(--doux)}

<script>
(function(){
  const C = window.COURBE, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const lire = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const compter = n => { try { window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path: 'courbe-' + n, title: n, event: true }); } catch (e) {} };
  const AUJ = C.numero(), TEST = false || /[?&]apercu/.test(location.search);
  let num = AUJ, etat = lire('courbe-jours', {}), sonOn = lire('courbe-son', true);
  /* bug du 12 novembre 2026 : certains scores ont été enregistrés « NaN ». On les recalcule avec les réponses gardées sur l'appareil, et on les renvoie. */
  Object.keys(etat).forEach(k => { const r = etat[k], n = +k; if (!r || Number.isFinite(r.s) || !Array.isArray(r.res)) return;
    let s = 0; for (let i = 0; i < 3; i++) s += C.points(!!r.res[i], +(r.ms || [])[i] || C.duree) * C.multi(n);
    if (r.bonus && Number.isFinite(r.bonus.pts)) s += r.bonus.pts; if (r.chance && Number.isFinite(r.chance.pts)) s += r.chance.pts; r.s = s; if (n >= AUJ - 1) r.envoye = false; });
  ecrire('courbe-jours', etat);

  /* ---------- Sons 8 bits ---------- */
  let ac = null;
  const bip = (f, d, t, type, vol) => { if (!sonOn) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (t || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(vol || .06, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d); return o; } catch (e) {} };
  const SON = {
    clic: () => bip(660, .05),
    juste: () => { bip(523, .08); bip(659, .08, .08); bip(784, .14, .16); },
    faux: () => { const o = bip(220, .35, 0, 'sawtooth', .05); if (o) o.frequency.exponentialRampToValueAtTime(90, ac.currentTime + .35); },

    fin: p => { const n = p === 3 ? [523, 659, 784, 1047, 784, 1047] : p ? [392, 523, 659] : [330, 262, 196]; n.forEach((f, i) => bip(f, .12, i * .11)); },
    carte: () => { [180, 260, 380, 560, 820].forEach((f, i) => bip(f, .05, i * .045, 'triangle', .07)); },
    start: () => { [262, 330, 392, 523].forEach((f, i) => bip(f, .07, i * .06)); }
  };
  /* ---------- Musique de fond : une boucle 8 bits composée ici, jouée par le navigateur (aucun fichier, aucun droit d'auteur tiers) ---------- */
  const MUS = (() => {
    let on = false, voulue = false, minuteur = null, pas = 0, tProch = 0, sortie = null, bruit = null;
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const BASE = { bpm:104, acc:[[45, 57, 60, 64], [41, 57, 60, 65], [48, 55, 60, 64], [43, 55, 59, 62], [45, 57, 60, 64], [41, 57, 60, 65], [48, 55, 60, 64], [40, 56, 59, 64]],
      mel:[[76, 0, 72, 0, 69, 0, 72, 74], [72, 0, 69, 0, 65, 0, 69, 72], [76, 0, 79, 0, 76, 72, 0, 0], [74, 0, 71, 0, 67, 0, 71, 74], [76, 76, 0, 72, 69, 0, 72, 76], [77, 0, 76, 0, 72, 0, 69, 0], [79, 0, 76, 0, 72, 0, 76, 79], [80, 0, 76, 0, 71, 0, 68, 0]] };
    /* Vice City : un groove mineur à la manière du disco-rock des années 70 (basse syncopée, pied sur tous les temps, accords à contretemps). Mélodie originale. */
    const VICE = { style:'vice', bpm:112, acc:[[45, 57, 60, 64], [45, 57, 60, 64], [38, 57, 62, 65], [45, 57, 60, 64], [41, 57, 60, 65], [43, 55, 59, 62], [45, 57, 60, 64], [40, 56, 59, 64]],
      mel:[[69, 0, 72, 0, 74, 72, 69, 0], [67, 69, 0, 0, 0, 0, 64, 67], [69, 0, 74, 0, 77, 74, 72, 0], [76, 0, 72, 69, 0, 0, 0, 0], [72, 0, 77, 0, 81, 0, 79, 77], [74, 0, 79, 0, 83, 0, 81, 79], [81, 0, 76, 0, 72, 0, 69, 0], [71, 0, 68, 0, 64, 0, 68, 71]] };
    /* Noël : le refrain de Jingle Bells (1857, domaine public), avec des grelots. */
    const NOEL = { style:'noel', bpm:116, acc:[[48, 55, 60, 64], [48, 55, 60, 64], [48, 55, 60, 64], [48, 55, 60, 64], [41, 57, 60, 65], [48, 55, 60, 64], [43, 55, 59, 62], [43, 55, 59, 62]],
      mel:[[76, 0, 76, 0, 76, 0, 0, 0], [76, 0, 76, 0, 76, 0, 0, 0], [76, 0, 79, 0, 72, 0, 74, 0], [76, 0, 0, 0, 0, 0, 0, 0], [77, 0, 77, 0, 77, 0, 77, 0], [77, 0, 76, 0, 76, 0, 76, 76], [76, 0, 74, 0, 74, 0, 76, 0], [74, 0, 0, 0, 79, 0, 0, 0]] };
    function unPas(P, pas, t0, d16){
      const s = pas % 256, i = s % 16, mesure = Math.floor(s / 16) % 8, tour2 = s >= 128, A = P.acc[mesure], st = P.style;
      const tenue = () => { const M = P.mel[mesure]; let k = 1; while (i / 2 + k < 8 && !M[i / 2 + k]) k++; return Math.min(k, 4); };
      if (st === 'vice') {
        const B = { 0:0, 3:12, 6:0, 8:0, 10:10, 12:12, 14:7 }[i]; if (B !== undefined) note(A[0] + B, t0, d16 * 1.5, 'sawtooth', .05);          // basse syncopée
        if (i === 2 || i === 6 || i === 10 || i === 14) for (const n of A.slice(1)) note(n + 12, t0, d16 * .8, 'square', .009);                   // accords à contretemps
        if (tour2 && i % 2 === 0) { const m = P.mel[mesure][i / 2]; if (m) note(m, t0, d16 * 1.9 * tenue(), 'sawtooth', .02); }
        if (i % 4 === 0) pied(t0); if (i === 4 || i === 12) coup(t0, .12, .06, 1800);
        coup(t0, .025, i % 4 === 2 ? .03 : .008, 7000);
      } else if (st === 'noel') {
        if (i === 0 || i === 8) note(A[0], t0, d16 * 3.4, 'triangle', .11); else if (i === 4 || i === 12) note(A[0] + 7, t0, d16 * 3, 'triangle', .08);
        if (i % 4 === 2) for (const n of A.slice(1)) note(n, t0, d16 * 1.2, 'triangle', .022);
        if (i % 2 === 0) { const m = P.mel[mesure][i / 2]; if (m) { note(m + (tour2 ? 12 : 0), t0, d16 * 1.8 * tenue(), 'square', tour2 ? .02 : .028); if (tour2) note(m, t0, d16 * 1.8 * tenue(), 'triangle', .04); } }
        if (i % 2 === 0) { coup(t0, .05, .03, 9000); coup(t0 + .012, .04, .018, 11000); }                                                   // grelots
        if (i === 0 || i === 8) pied(t0);
      } else {
        if (i === 0 || i === 6 || i === 8 || i === 14) note(A[0], t0, d16 * 2.6, 'triangle', .11); else if (i === 4 || i === 12) note(A[0] + 7, t0, d16 * 1.8, 'triangle', .08);
        note(A[1 + [0, 1, 2, 1][i % 4]] + (i % 8 >= 4 ? 12 : 0), t0, d16 * .9, 'square', .016);
        if (tour2 && i % 2 === 0) { const m = P.mel[mesure][i / 2]; if (m) note(m, t0, d16 * 1.9, 'square', .03); }
        if (i === 0 || i === 8 || (i === 10 && mesure % 2)) pied(t0);
        if (i === 4 || i === 12) coup(t0, .09, .05, 1800);
        if (i % 2 === 0) coup(t0, .03, .014, 7000);
      }
    }
    function init(){
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (sortie) return;
      sortie = ac.createGain(); sortie.gain.value = 0;
      const doux = ac.createBiquadFilter(); doux.type = 'lowpass'; doux.frequency.value = 3200; sortie.connect(doux).connect(ac.destination);
      bruit = ac.createBuffer(1, Math.floor(ac.sampleRate * .2), ac.sampleRate); const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    function note(m, t0, d, type, vol){ const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(hz(m), t0);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(sortie); o.start(t0); o.stop(t0 + d + .02); }
    function coup(t0, d, vol, aigu){ const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter(); s.buffer = bruit; f.type = 'highpass'; f.frequency.value = aigu;
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); s.connect(f).connect(g).connect(sortie); s.start(t0); s.stop(t0 + d + .02); }
    function pied(t0){ const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(130, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + .11);
      g.gain.setValueAtTime(.16, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + .14); o.connect(g).connect(sortie); o.start(t0); o.stop(t0 + .16); }
    function programme(){
      if (!on) return;
      const c = document.body.classList, P = c.contains('vice') ? VICE : c.contains('noel') ? NOEL : BASE, d16 = 60 / P.bpm / 4;
      if (tProch < ac.currentTime) tProch = ac.currentTime + .05;
      while (tProch < ac.currentTime + .3) { unPas(P, pas, tProch, d16); tProch += d16; pas++; }
    }
    function marche(){ if (on || !voulue || !sonOn || document.hidden) return; try { init(); if (ac.resume) ac.resume(); } catch (e) { return; }
      on = true; tProch = ac.currentTime + .1; sortie.gain.cancelScheduledValues(ac.currentTime); sortie.gain.setValueAtTime(sortie.gain.value, ac.currentTime); sortie.gain.linearRampToValueAtTime(.22, ac.currentTime + 1.5)   /* très bas : un fond, pas un morceau */;
      minuteur = setInterval(programme, 80); programme(); }
    function arret(){ if (!on) return; on = false; clearInterval(minuteur); sortie.gain.cancelScheduledValues(ac.currentTime); sortie.gain.setValueAtTime(sortie.gain.value, ac.currentTime); sortie.gain.linearRampToValueAtTime(0, ac.currentTime + .25); }
    document.addEventListener('visibilitychange', () => document.hidden ? arret() : marche());
    return { lancer(){ voulue = true; marche(); }, maj(){ sonOn ? marche() : arret(); } };
  })();
  const majSon = () => { $('son').textContent = '♪ SON : ' + (sonOn ? 'OUI' : 'NON'); $('son').setAttribute('aria-pressed', sonOn); };
  $('son').addEventListener('click', () => { sonOn = !sonOn; ecrire('courbe-son', sonOn); majSon(); SON.clic(); MUS.maj(); });
  majSon();

  /* ---------- La Courbe en pixels, et le lamantin ---------- */
  const W = 160, H = 50, ZX = { 'T-2': 26, 'T-1': 61, 'T0': 96, 'T+1': 131 };
  const cv = $('courbe'), g = cv.getContext('2d');
  const yC = x => Math.round(31 + 2.2 * Math.sin(x / 12) + 1 * Math.sin(x / 5));
  const SPRITE = [
    '........oooooo......',
    '......oobbbbbboo....',
    '....oobbbbbbbbbboo..',
    'oo.obbbbbbbbbbbbbeo.',
    'obbobbbbbbbbbbbbbbno',
    'obbbbbbbbbbbbbbbbnno',
    'oo.obllllllllllbbbo.',
    '....oollllllllboo...',
    '......oooobboo......',
    '.........obbo.......'
  ];
  const COUL = { o: '#24386A', b: '#9FB3D9', l: '#DCE5F5', e: '#0A1330', n: '#C3D0EC' };
  const sprite = (ctx, x0, y0, s) => SPRITE.forEach((r, y) => [...r].forEach((c, x) => { if (COUL[c]) { ctx.fillStyle = COUL[c]; ctx.fillRect(x0 + x * s, y0 + y * s, s, s); } }));
  let lam = { x: 12, cible: 12 }, zoneVue = null, t = 0;
  function dessiner(){
    g.clearRect(0, 0, W, H);
    if (zoneVue) { const zx = ZX[zoneVue]; g.fillStyle = 'rgba(77,123,224,.28)'; for (let y = 12; y < H - 1; y += 2) for (let x = zx - 15 + (y / 2 % 2); x < zx + 15; x += 2) g.fillRect(x, y, 1, 1); }
    g.fillStyle = '#F4EEDC';
    for (let x = 4; x < 152; x++) g.fillRect(x, yC(x), 1, 2);
    for (let i = 0; i < 5; i++) { g.fillRect(151 - i, yC(151) - i, 1, 2); g.fillRect(151 - i, yC(151) + i, 1, 2); }
    g.fillStyle = '#4D7BE0'; Object.values(ZX).forEach(x => g.fillRect(x, yC(x) + 4, 1, 3));
    const bob = Math.round(Math.sin(t / 9) * 1.2), lx = Math.round(lam.x);
    sprite(g, lx - 10, yC(lx) - 13 + bob, 1);
    if (Math.abs(lam.cible - lam.x) > .5) { lam.x += (lam.cible - lam.x) * .08; g.fillStyle = '#DCE5F5'; if (t % 6 < 3) g.fillRect(lx - 13, yC(lx) - 4 + bob, 1, 1); }
    t++; requestAnimationFrame(dessiner);
  }
  $('labels').innerHTML = Object.entries(ZX).map(([z, x]) => `<span data-z="${z}" style="left:${x / W * 100}%">${z}</span>`).join('');
  requestAnimationFrame(dessiner);
  sprite($('dos-lam').getContext('2d'), 0, 0, 1);
  const couleurCode = c => /-ed/.test(c) && !/have|be \+/.test(c) ? 'var(--corail)' : /have/.test(c) ? 'var(--jaune)' : /be \+|-ing/.test(c) ? 'var(--vert)' : /^-s/.test(c) ? 'var(--bleu-clair)' : 'var(--argent)';
  function poserZone(z){ zoneVue = z; lam.cible = ZX[z]; document.querySelectorAll('.labels span').forEach(s => s.classList.toggle('vu', s.dataset.z === z)); }
  function poserCode(z, code){ const p = $('pastille'); p.textContent = code; p.style.left = Math.min(82, Math.max(18, ZX[z] / W * 100)) + '%'; p.style.background = couleurCode(code); p.style.setProperty('--b', couleurCode(code)); p.classList.add('vu');
    { const ecran = p.closest('.ecran') || p.parentNode, sc = p.parentNode, demi = p.offsetWidth / 2, marge = 10;   /* la pastille ne dépasse jamais du cadre */
      const off = sc.getBoundingClientRect().left - ecran.getBoundingClientRect().left, larg = ecran.clientWidth;
      const centre = Math.min(larg - demi - marge, Math.max(demi + marge, off + sc.clientWidth * parseFloat(p.style.left) / 100));
      p.style.left = (centre - off) + 'px'; } }
  function reinitScene(){ zoneVue = null; lam.cible = 12; $('pastille').classList.remove('vu'); document.querySelectorAll('.labels span').forEach(s => s.classList.remove('vu')); }

  /* ---------- Classement (base de l'aperçu, ou serveur du site) ---------- */
  let classement = null, monId = null;
  const DEF_PSEUDO = lire('courbe-pseudo', '');
  async function brancherClassement(){
    try { if (window.claude && claude.use) { const db = await claude.use('db'), user = db && await claude.use('user'); monId = user && await user.id();
      if (db && monId) { const col = db.collection('joueurs');
        classement = {
          async envoyer(n, pseudo, score){ const ref = col.doc(monId), s = await ref.get(), d = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};

    afficherTop(r); afficherGagnant($('gagnant'));
  }


  /* ---------- Fin de saison : le gagnant laisse son mail ---------- */
  async function afficherGagnant(el){
    await pret; if (!el || !classement || !classement.gagnant) return;
    const ref = TEST ? Math.max(AUJ, num) : AUJ, S = C.saison(ref) - 1; if (S < 1) return;
    let g; try { g = await classement.gagnant(S, ref); } catch (e) { return; }
    if (!g || !g.fini || !g.pseudo) return;
    if (!g.moi) { el.innerHTML = `<div class="boite px gagne"><h3>SAISON ${S} TERMINEE</h3><p>Gagnant : <b>${esc(g.pseudo)}</b>. La saison ${S + 1} est lancée.</p></div>`; return; }
    if (g.reclame) { el.innerHTML = `<div class="boite px gagne"><h3>VOUS AVEZ GAGNE LA SAISON ${S}</h3><p>Demande bien reçue : votre code de réduction arrive par mail.</p></div>`; return; }
    el.innerHTML = `<div class="boite px gagne"><h3>VOUS AVEZ GAGNE LA SAISON ${S} !</h3><p>N°1 de la saison : <b>-${C.reduction} %</b> sur une formation Frenglais. Laissez votre mail pour recevoir votre code.</p>
      <form class="pseudo" id="f-mail"><input id="i-mail" type="email" required autocomplete="email" aria-label="Votre adresse mail" placeholder="vous@exemple.com" style="text-transform:none"><button class="btn" type="submit">ENVOYER</button></form><p class="note" id="n-mail"></p></div>`;
    $('f-mail').addEventListener('submit', async ev => { ev.preventDefault(); const m = $('i-mail').value.trim(), note = $('n-mail');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)) { note.textContent = 'Adresse invalide.'; note.className = 'note err'; return; }
      note.textContent = 'Envoi…'; note.className = 'note';
      try { await classement.reclamer(S, m);
        try { await fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify({ access_key: C.web3forms, subject: 'Courbe du jour · gagnant de la saison ' + S, from_name: 'Courbe du jour', email: m, message: 'Gagnant de la saison ' + S + ' : ' + g.pseudo + '\nMail : ' + m + '\nRéduction : -' + C.reduction + ' %' }) }); } catch (e) {}
        $('f-mail').remove(); note.textContent = 'Reçu ! Votre code de réduction arrive par mail.'; SON.fin(3); compter('gagnant'); }
      catch (e) { note.textContent = 'Envoi impossible : ' + (e.message || 'réessayez plus tard') + '.'; note.className = 'note err'; } });
  }

  /* dernier jour de la saison : le joueur en tête est prévenu et peut laisser son mail tout de suite */
  function alerteDernierJour(saison){
    const el = $('gagnant'), S = C.saison(num);
    if (!el || el.dataset.pre || !C.dernierJour(num) || (num !== AUJ && !TEST) || !saison[0] || !saison[0].moi || !classement || !classement.prereclamer) return;
    el.dataset.pre = '1';
    if (lire('courbe-pre-' + S, false)) { el.innerHTML = `<div class="boite px gagne"><h3>VOUS ETES N°1 !</h3><p>Votre mail est noté. Si personne ne vous dépasse avant minuit, votre code <b>-${C.reduction} %</b> vous sera envoyé.</p></div>`; return; }
    el.innerHTML = `<div class="boite px gagne"><h3>VOUS ETES N°1 !</h3><p>Dernier jour de la saison ${S}. Si personne ne vous dépasse avant minuit, vous gagnez <b>-${C.reduction} %</b> sur une formation Frenglais. Laissez votre mail maintenant pour recevoir votre code.</p>
      <form class="pseudo" id="f-pre"><input id="i-pre" type="email" required autocomplete="email" aria-label="Votre adresse mail" placeholder="vous@exemple.com" style="text-transform:none"><button class="btn" type="submit">ENVOYER</button></form><p class="note" id="n-pre">Votre adresse ne sert qu'à cela. Si vous ne gagnez pas, elle est supprimée.</p></div>`;
    SON.fin(3); el.scrollIntoView({ block: 'nearest', behavior: calme ? 'auto' : 'smooth' });
    $('f-pre').addEventListener('submit', async ev => { ev.preventDefault(); const m = $('i-pre').value.trim(), note = $('n-pre');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)) { note.textContent = 'Adresse invalide.'; note.className = 'note err'; return; }
      note.textContent = 'Envoi…'; note.className = 'note';
      try { await classement.prereclamer(S, m); ecrire('courbe-pre-' + S, true); $('f-pre').remove(); note.textContent = 'C\'est noté ! Résultat définitif demain.'; compter('pre-gagnant'); }
      catch (e) { note.textContent = 'Envoi impossible : ' + (e.message || 'réessayez plus tard') + '.'; note.className = 'note err'; } });
  }

  let onglet = 'jour';
  async function afficherTop(r){
    await pret;
    const zone = $('zone-top'); if (!zone) return;
    if (!classement) { zone.innerHTML = '<p class="note">Le classement arrive bientôt. Votre score reste enregistré sur cet appareil.</p>'; return; }
    const pseudo = lire('courbe-pseudo', '');
    let html = '';
    if (!r.envoye) html += `<form class="pseudo" id="f-pseudo"><input id="i-pseudo" maxlength="14" autocomplete="nickname" aria-label="Votre pseudo" placeholder="VOTRE PSEUDO" value="${esc(pseudo)}"><button class="btn" type="submit">ENTRER</button></form><p class="note" id="n-pseudo">Entrez un pseudo pour inscrire votre score.</p>`;
    html += `<div class="onglets" role="tablist"><button type="button" role="tab" data-o="jour" aria-selected="${onglet === 'jour'}">AUJOURD'HUI</button><button type="button" role="tab" data-o="saison" aria-selected="${onglet === 'saison'}">LA SAISON</button></div><ol class="top" id="liste"></ol><p class="rang" id="rang"></p>`;
    zone.innerHTML = html;
    zone.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => { onglet = b.dataset.o; zone.querySelectorAll('[data-o]').forEach(x => x.setAttribute('aria-selected', x === b)); remplir(); }));
    let donnees = null;
    async function charger(){ try { donnees = await classement.lire(num); } catch (e) { donnees = null; } remplir(); }
    function remplir(){
      const L = $('liste'); if (!L) return;
      if (!donnees) { L.innerHTML = '<li class="vide">Classement indisponible pour l\'instant.</li>'; return; }
      const liste = donnees[onglet] || [];
      const nb = onglet === 'saison' ? Math.min(10, Math.max(3, liste.length)) : 3; const h = document.querySelector('#bloc-top h3'); if (h) h.textContent = onglet === 'saison' ? 'TOP 10' : 'TOP 3';
      L.innerHTML = Array.from({ length: nb }, (_, i) => i).map(i => { const x = liste[i]; return x ? `<li class="${x.moi ? 'moi' : ''}"><span class="rg">${i + 1}${i ? 'E' : 'ER'}</span><span>${esc(x.p)}</span><span class="pt">${pad(x.s, onglet === 'jour' ? 3 : 5)}</span></li>` : `<li class="vide"><span class="rg">${i + 1}${i ? 'E' : 'ER'}</span><span>- - -</span><span></span></li>`; }).join('');
      const pos = liste.findIndex(x => x.moi);
      alerteDernierJour(donnees.saison || []);
      $('rang').textContent = (pos > nb - 1 ? `Vous êtes ${pos + 1}e sur ${liste.length}.` : (liste.length ? `${liste.length} joueur${liste.length > 1 ? 's' : ''}.` : ''));
    }
    if (!r.envoye && pseudo && !C.pseudoValide(pseudo)) { const note = $('n-pseudo'); note.textContent = 'Envoi de votre score…';
      try { await classement.envoyer(num, pseudo, r.s, r); r.envoye = true; etat[num] = r; ecrire('courbe-jours', etat); const ff = $('f-pseudo'); if (ff) ff.remove(); charger(); if ($('n-pseudo')) $('n-pseudo').textContent = 'Score inscrit. Bravo, ' + lire('courbe-pseudo', pseudo) + ' !'; compter('pseudo'); }
      catch (e) { if ($('n-pseudo')) { $('n-pseudo').textContent = 'Votre score n\'a pas pu être inscrit : ' + (e.message || 'réessayez plus tard') + '.'; $('n-pseudo').className = 'note err'; } } }
    const f = $('f-pseudo');
    if (f) f.addEventListener('submit', async ev => { ev.preventDefault(); const p = $('i-pseudo').value.trim().toUpperCase(), err = C.pseudoValide(p), note = $('n-pseudo');
      if (err) { note.textContent = err; note.className = 'note err'; SON.faux(); return; }
      note.textContent = 'Envoi…'; note.className = 'note';
      try { await classement.envoyer(num, p, r.s, r); if (!lire('courbe-pseudo', '')) ecrire('courbe-pseudo', p); r.envoye = true; etat[num] = r; ecrire('courbe-jours', etat); f.remove(); note.textContent = 'Score inscrit. Bravo, ' + p + ' !'; SON.juste(); compter('pseudo'); charger(); }
      catch (e) { note.textContent = 'Votre score n\'a pas pu être inscrit : ' + (e.message || 'réessayez plus tard') + '.'; note.className = 'note err'; } });
    charger();
    /* le classement se met à jour tout seul : toutes les 30 s tant que la page est visible, et dès qu'on revient sur l'onglet */
    clearInterval(afficherTop.minuteur); afficherTop.minuteur = setInterval(() => { if (!document.hidden && $('liste')) charger(); }, 30000);
    if (!afficherTop.vue) { afficherTop.vue = true; document.addEventListener('visibilitychange', () => { if (!document.hidden && $('liste') && afficherTop.recharger) afficherTop.recharger(); }); }
    afficherTop.recharger = charger;
  }

  if (TEST) { $('apercu').classList.remove('cache'); $('prec').addEventListener('click', () => { if (num > 1) { num--; rendre(); } }); $('suiv').addEventListener('click', () => { num++; rendre(); }); }
  rendre();
})();
</script>
