<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bon cadeau · Frenglais</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<style>
@font-face{font-family:Geist;src:url(fonts/geist.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Cinzel;src:url(fonts/cinzel-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(fonts/geist-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--bleu:#1C49A5;--corail:#F0766F;--encre:#0E1B3D;--doux:#5B6683;--trait:#E2E6F0}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F7;color:var(--encre);font:16px/1.5 Geist,-apple-system,"Segoe UI",sans-serif}
.barre{max-width:560px;margin:28px auto 0;padding:0 16px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.barre p{margin:0;color:var(--doux);font-size:14px}
.barre button{min-height:44px;padding:0 20px;border:0;border-radius:99px;background:linear-gradient(180deg,#2457C4,#1C49A5);color:#fff;font:600 15px Geist,sans-serif;cursor:pointer}
.bon{width:148mm;max-width:calc(100vw - 32px);aspect-ratio:148/210;margin:18px auto 40px;background:#fff;border-radius:20px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 80px -40px rgba(14,27,61,.55),0 2px 6px rgba(14,27,61,.08);overflow:hidden;display:flex;flex-direction:column;position:relative}
.bon::after{content:"";position:absolute;inset:10px;border:1px solid rgba(14,27,61,.09);border-radius:13px;pointer-events:none;z-index:3}
.bon{--h1:#2457C4;--h2:#1C49A5;--h3:#183F92;--accent:#1C49A5;--cadre:rgba(28,73,165,.25);--fond-code:#F7F9FE}
.bon.sig{--h1:#2A3A6B;--h2:#14224A;--h3:#0B1430;--accent:#C9574F;--cadre:rgba(201,87,79,.32);--fond-code:#FFF7F6}
.haut{background:radial-gradient(120% 90% at 85% 0%,var(--h1) 0%,var(--h2) 55%,var(--h3) 100%);color:#fff;padding:10% 10% 8%;position:relative;overflow:hidden;text-align:center}
.haut::before{content:"";position:absolute;inset:0;background:url(grain.svg);opacity:.18;mix-blend-mode:overlay;pointer-events:none}
.haut::after{content:"";position:absolute;inset:10px 10px 0;border:1px solid rgba(255,255,255,.22);border-bottom:0;border-radius:13px 13px 0 0;pointer-events:none}
.haut img{height:40px;display:block;margin:0 auto}
.haut .eyebrow{margin:20px 0 0;font:600 11px Cinzel,serif;letter-spacing:.42em;text-transform:uppercase;opacity:.9;padding-left:.42em}
.haut .eyebrow::before,.haut .eyebrow::after{content:"";display:inline-block;width:26px;height:1px;background:rgba(255,255,255,.55);vertical-align:middle;margin:0 12px}
.haut h1{margin:10px 0 0;font-size:clamp(28px,8vw,44px);line-height:1.02;letter-spacing:-.03em;font-weight:700}
.ruban{position:absolute;z-index:2;right:9%;top:-2px;width:40px;height:70px;background:linear-gradient(90deg,#E5655E,#F0766F 45%,#F58A84);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.haut>*:not(.kdo-mousse):not(.ruban){position:relative}
.kdo-mousse{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.85}
.haut img{position:relative;z-index:0}
.corps{padding:7% 10% 0;flex:1;display:flex;flex-direction:column;position:relative;text-align:center}
.formule{margin:0;font:600 clamp(17px,4.4vw,21px) Cinzel,serif;letter-spacing:.16em;text-transform:uppercase;color:var(--encre)}
.bon.sig .formule{color:var(--h2)}.option{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;font:600 10px Cinzel,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid var(--cadre)}
.formule small{display:block;font:400 13px Geist,sans-serif;letter-spacing:0;text-transform:none;color:var(--doux);margin-top:6px}
.courbe{margin:5% -3% 3%;color:var(--encre)}
.courbe svg{width:100%;height:auto;display:block;overflow:visible}
.courbe text{font:500 11px "Geist Mono",monospace}
.message{position:relative;margin:2% auto 3%;max-width:88%;font-size:clamp(15px,3.9vw,18px);font-style:italic;line-height:1.5;color:var(--encre)}
.message::before{content:"“";display:block;font:700 46px/0.6 Georgia,serif;color:var(--corail);margin-bottom:6px}
.de{margin:0 auto;font-size:13px;color:var(--doux);letter-spacing:.02em}
.de::before{content:"";display:block;width:36px;height:1px;background:var(--trait);margin:0 auto 8px}
.talon{margin-top:auto;position:relative;padding:6% 0 0}
.talon::before{content:"";position:absolute;left:-12%;right:-12%;top:0;border-top:1.5px dashed rgba(14,27,61,.16)}
.talon::after{content:"";position:absolute;top:-11px;left:calc(-10% - 11px);right:calc(-10% - 11px);height:22px;background:radial-gradient(circle at 0 50%,#EEF1F7 10px,transparent 11px) left/22px 22px no-repeat,radial-gradient(circle at 100% 50%,#EEF1F7 10px,transparent 11px) right/22px 22px no-repeat}
.code{display:inline-block;padding:10px 18px 9px;border:1px solid var(--cadre);border-radius:12px;background:linear-gradient(180deg,var(--fond-code),#fff)}
.code small{display:block;font:600 9.5px Cinzel,serif;letter-spacing:.3em;color:var(--doux);text-transform:uppercase;padding-left:.3em}
.code b{display:block;margin-top:3px;font:500 clamp(17px,4.6vw,22px) "Geist Mono",monospace;letter-spacing:.12em;color:var(--accent)}
.ou{margin:10px 0 0;font-size:12.5px;color:var(--doux)}.ou strong{color:var(--encre);font-weight:600}
.pied{padding:4% 12% 7%;font-size:10px;color:var(--doux);line-height:1.5;text-align:center;letter-spacing:.01em}
.etat{max-width:560px;margin:60px auto;padding:0 16px;text-align:center;color:var(--doux)}
.utilise{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font:700 28px Geist,sans-serif;color:#1E7A4F;transform:rotate(-12deg)}
@page{size:A5 portrait;margin:0}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}.talon::after{display:none}.barre{display:none}.bon{width:148mm;height:210mm;max-width:none;margin:0;border-radius:0;box-shadow:none;aspect-ratio:auto}.haut{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ruban{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});</script>
</head>
<body>
<div class="barre" id="barre" hidden><p>Format A5. Choisissez « Enregistrer en PDF » pour le garder ou l'envoyer.</p><button type="button" onclick="print()">Imprimer le bon</button></div>
<div id="zone"><p class="etat">Chargement du bon…</p></div>
<script src="courbe-main.js?v=1"></script>
<script src="mousse.js?v=202611201500"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), API='https://courbe-classement.paulodubmx84.workers.dev', z=document.getElementById('zone');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  fetch(API+'/cadeau/bon?c='+encodeURIComponent(q.get('c')||'')+'&k='+encodeURIComponent(q.get('k')||'')).then(function(r){return r.json()}).then(function(b){
    if(b.erreur){z.innerHTML='<p class="etat">Ce bon est introuvable. Vérifiez le lien reçu par e-mail, ou écrivez à contact@frenglais.co.</p>';return;}
    var xs=[60,165,290,445], c=window.FRGcourbe?FRGcourbe({xs:xs,x0:10,x1:510,y:40,k:.3}).svg:'';
    var lab=['T-2','T-1','T0','T+1'].map(function(t,i){return '<text x="'+xs[i]+'" y="16" text-anchor="middle" fill="'+(i===1||i===2?'#0E1B3D':'#e3191f')+'">'+t+'</text>'}).join('');
    var codes='<text x="165" y="88" text-anchor="middle" fill="#F0766F">-ed</text><text x="290" y="88" text-anchor="middle" fill="#1C49A5">-s</text>';
    var fin=new Date(b.expire).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
    var sig=(b.cle||b.formule||'').toLowerCase().indexOf('signature')>-1, live=/suivi live/i.test(b.formule||''), nomF=String(b.formule||'').replace(/ \+ Suivi live$/i,'');
    z.innerHTML='<article class="bon'+(sig?' sig':'')+'" aria-label="Bon cadeau Frenglais">'+
      '<div class="haut"><canvas class="mousse kdo-mousse" data-relatif="1" data-pash="0.07" data-vent=".05" data-modele=\'[[0.01,8],[0.035,12],[0.07,6],[0.115,9],[0.165,5],[0.21,3],[0.425,5],[0.46,3],[0.545,6],[0.585,3]]\' aria-hidden="true"></canvas><span class="ruban" aria-hidden="true"></span><img src="logo-nav.webp" alt="Frenglais"><p class="eyebrow">Bon cadeau</p><h1>Pour '+esc(b.pour)+'</h1></div>'+
      '<div class="corps"><p class="formule">'+esc(nomF)+'<small>'+(sig?'32 modules, l’oral et le retour personnel de Paul · accès à vie':'La formation d’anglais Frenglais, 24 modules · accès à vie')+'</small>'+(live?'<span class="option">+ Suivi live</span>':'')+'</p>'+
      '<div class="courbe" aria-hidden="true"><svg viewBox="0 0 520 94">'+lab+c+codes+'</svg></div>'+
      (b.message?'<p class="message">'+esc(b.message)+'</p>':'')+(b.de?'<p class="de">De la part de '+esc(b.de)+'</p>':'')+
      '<div class="talon"><div class="code"><small>Code cadeau</small><b>'+esc(b.code)+'</b></div><p class="ou">À activer sur <strong>frenglais.co/cadeau</strong></p></div></div>'+
      '<p class="pied">Valable jusqu’au '+fin+'. L’accès à vie démarre à l’activation. L’anglais n’a que deux temps : -ed et -s. Le reste se construit dessus.</p>'+
      (b.statut==='active'?'<div class="utilise">Bon activé ✓</div>':'')+'</article>';
    document.getElementById('barre').hidden=false;
    var cv=z.querySelector('canvas.mousse');if(cv&&window.FRGmousse)FRGmousse(cv);
  }).catch(function(){z.innerHTML='<p class="etat">Connexion impossible. Réessayez dans un instant.</p>';});
})();
</script>
</body>
</html>
